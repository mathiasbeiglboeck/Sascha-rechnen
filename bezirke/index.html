<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bezirke">
<meta name="theme-color" content="#f6f1e6">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Wiener Bezirke</title>
<style>
:root {
  --bg: #f6f1e6; --card: #fffdf8; --ink: #2d2a24; --muted: #7b7366; --line: #e4dbc8;
  --acc: #d97a1e; --acc2: #f6b04d; --ok: #3f9b55; --okbg: #dff1e2; --bad: #cf4a3c; --badbg: #fbe3df;
  --land: #efe5cc; --stroke: #a39478; --off: #ebe8e1; --water: #7cb9e2;
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); }
body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
#app { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) max(14px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(14px, env(safe-area-inset-left)); }

/* Kopfzeile */
.top { display: flex; align-items: center; gap: 10px; padding: 10px 0 6px; min-height: 52px; }
.top h2 { font-size: 18px; margin: 0; flex: 1; font-weight: 700; }
.x { width: 40px; height: 40px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); font-size: 18px; line-height: 1; flex: none; }
.dots { flex: 1; display: flex; gap: 4px; }
.dots i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.dots i.ok { background: var(--ok); } .dots i.half { background: var(--acc2); } .dots i.bad { background: var(--bad); } .dots i.now { background: var(--ink); }
.clock { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; min-width: 64px; text-align: right; }

/* Karte */
.karte { position: relative; width: 100%; height: clamp(230px, 43dvh, 430px); flex: none; }
.karte svg { width: 100%; height: 100%; display: block; touch-action: manipulation; }
.bz { fill: var(--land); stroke: var(--stroke); stroke-width: 1.1px; vector-effect: non-scaling-stroke; transition: fill .25s; cursor: pointer; stroke-linejoin: round; }
.bz.off { fill: var(--off); stroke: #d5cfc2; cursor: default; }
.bz.target { fill: var(--acc2); }
.bz.sel { fill: var(--acc2); }
.bz.ok { fill: #7cc58a; }
.bz.bad { fill: #ee7b70; }
.bz.done { fill: #bfe2c4; }
.bz.glow { animation: glow .8s ease-in-out infinite alternate; }
@keyframes glow { from { fill: #fff1c4; } to { fill: #ffd36b; } }
.bz.blink { animation: blink .45s ease-in-out 3 alternate; }
@keyframes blink { from { fill: var(--land); } to { fill: #7cc58a; } }
.top-bz { stroke: var(--ink); stroke-width: 2.4px; }
.river { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; pointer-events: none; }
.lb { font-family: var(--f); font-weight: 750; fill: #3b352a; text-anchor: middle; dominant-baseline: central; pointer-events: none;
  paint-order: stroke; stroke: rgba(255,253,245,.85); stroke-linejoin: round; }
.lb.off { fill: #bdb6a8; }
.lb.hide { display: none; }
.fl { font-family: var(--f); font-style: italic; fill: #3f86b9; pointer-events: none; font-weight: 600; }
.zoom { position: absolute; right: 6px; bottom: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 7px 12px; font-size: 14px; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.toast { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); background: rgba(45,42,36,.9); color: #fff; padding: 7px 12px; border-radius: 14px; font-size: 15px; font-weight: 600; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: 96%; overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; }

/* Startseite */
.home h1 { font-size: 28px; margin: 14px 0 0; letter-spacing: -.3px; }
.home .sub { color: var(--muted); margin: 2px 0 12px; font-size: 15px; }
.seg { display: flex; background: #e9e1cf; border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 10px; font-weight: 650; font-size: 15px; color: #5d5547; line-height: 1.15; }
.seg button small { display: block; font-size: 12px; font-weight: 500; opacity: .8; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.home .karte { height: clamp(200px, 34dvh, 380px); margin: 6px 0 2px; }
.legend { display: flex; justify-content: center; gap: 12px; font-size: 13px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid #0001; display: inline-block; }
.score { text-align: center; font-weight: 700; margin: 4px 0 10px; font-size: 15px; }
.score .st { color: #e2a400; }
.menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.menu button { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 76px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.menu button:active { transform: scale(.98); }
.menu .ic { font-size: 22px; }
.menu b { font-size: 16px; }
.menu small { color: var(--muted); font-size: 13px; }
.menu .wide { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 12px; min-height: 60px; }
.menu .wide > div { display: flex; flex-direction: column; gap: 2px; }
.foot { display: flex; justify-content: space-between; align-items: center; margin: 14px 0 18px; gap: 10px; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 8px 12px; font-size: 14px; }
.link { color: var(--muted); font-size: 13px; text-decoration: underline; padding: 8px 0; }
.link.warn { color: var(--bad); font-weight: 600; }

/* Fragen */
.panel { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 8px 0 16px; }
.ask { font-size: 21px; font-weight: 700; text-align: center; line-height: 1.25; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; }
.ask .big { font-size: 34px; color: var(--acc); }
.ask .nm { color: var(--acc); }
.say { width: 38px; height: 38px; border-radius: 19px; background: var(--card); border: 1px solid var(--line); font-size: 17px; flex: none; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 8px; font-size: 17px; font-weight: 650; min-height: 56px; line-height: 1.15; word-break: break-word; hyphens: auto; transition: opacity .2s, background .2s; }
.opt:active { transform: scale(.98); }
.opt.ok { background: var(--okbg); border-color: var(--ok); color: #1e6b33; }
.opt.bad { background: var(--badbg); border-color: var(--bad); color: #9b2c22; }
.opt.gone { opacity: .25; pointer-events: none; }
.opt:disabled { cursor: default; }
.row { display: flex; gap: 8px; align-items: stretch; }
.hint-btn { background: #fff4d6; border: 1px solid #f0d58e; border-radius: 14px; padding: 10px 14px; font-weight: 650; font-size: 16px; flex: none; }
.hint-btn:disabled { opacity: .45; }
.hint { background: #fff8e3; border: 1px solid #f3e1a9; border-radius: 14px; padding: 10px 12px; font-size: 16px; line-height: 1.35; flex: 1; }
.hint:empty { display: none; }
.fb { border-radius: 16px; padding: 12px 14px; font-size: 16px; line-height: 1.4; }
.fb.ok { background: var(--okbg); }
.fb.bad { background: var(--badbg); }
.fb b { font-size: 18px; }
.fb .st { color: #e2a400; letter-spacing: 1px; }
.go { background: var(--ink); color: #fff; border-radius: 16px; padding: 14px; font-size: 18px; font-weight: 700; width: 100%; }
.go.sec { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.go:active { transform: scale(.99); }

/* Lernkarte */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.card .head { display: flex; align-items: center; gap: 10px; }
.num { width: 52px; height: 52px; border-radius: 26px; background: var(--acc2); color: #3b2a0c; font-weight: 800; font-size: 22px; display: grid; place-items: center; flex: none; }
.card h3 { margin: 0; font-size: 22px; flex: 1; line-height: 1.15; }
.card .st { color: #e2a400; font-size: 15px; letter-spacing: 1px; }
.card .merk { margin: 10px 0 0; font-size: 16px; line-height: 1.4; }
.card .story { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.card .story h4 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.card .story img { width: 100%; max-width: 300px; display: block; margin: 0 auto 8px; border-radius: 12px; aspect-ratio: 374 / 232; background: #e5eef0; }
.card .story p { margin: 0; font-size: 15px; line-height: 1.45; }
.card .story .src { color: var(--muted); font-size: 12px; margin-top: 6px; }
.nav { display: flex; gap: 8px; }
.nav button { flex: 1; }
.tip { color: var(--muted); text-align: center; font-size: 15px; padding: 14px 6px; }

/* Ende */
.end { text-align: center; }
.end .big { font-size: 46px; margin: 6px 0 0; }
.end h2 { margin: 6px 0 4px; font-size: 24px; }
.end p { margin: 4px 0; color: var(--muted); font-size: 15px; line-height: 1.4; }
.end .res { font-size: 18px; color: var(--ink); font-weight: 600; }
.pen { color: var(--bad); font-weight: 700; font-size: 16px; margin-left: 4px; }
</style>
</head>

function say(text) {
  if (!S.ton || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = voices.find(v => v.lang === "de-AT") || voices.find(v => v.lang === "de-DE") || voices.find(v => (v.lang || "").startsWith("de"));
    u.lang = v ? v.lang : "de-AT"; if (v) u.voice = v;
    u.rate = 0.92;
    speechSynthesis.speak(u);

}
const sayB = n => say(`Der ${ORD[n]} Bezirk: ${B[n].name}`);
let actx;
function tone(kind) {
  if (!S.ton) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = kind === "ok" ? [660, 880] : kind === "win" ? [523, 659, 784, 1047] : [220, 185];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.09;
      o.type = kind === "bad" ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch (e) {}
}

const $ = (s, el = document) => el.querySelector(s);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = ms => { const s = ms / 1000, m = Math.floor(s / 60); return m + ":" + (s - m * 60).toFixed(1).padStart(4, "0"); };

// Richtung vom Stadtzentrum (Mittelpunkt des 1. Bezirks) aus
function richtung(n) {
  if (n === 1) return "Er liegt ganz in der Mitte von Wien.";
  const c = MAP.d[1].l, p = MAP.d[n].l;
  const dx = p[0] - c[0], dy = c[1] - p[1];
  const a = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
  const i = Math.round(a / 45) % 8;
  const adj = ["östlich", "nordöstlich", "nördlich", "nordwestlich", "westlich", "südwestlich", "südlich", "südöstlich"][i];
  const sub = ["Osten", "Nordosten", "Norden", "Nordwesten", "Westen", "Südwesten", "Süden", "Südosten"][i];
  const einfach = ["rechts", "rechts oben", "oben", "links oben", "links", "links unten", "unten", "rechts unten"][i];
  if (Math.hypot(dx, dy) < 125) return `Er liegt nah an der Mitte, ${adj} (${einfach}) vom 1. Bezirk.`;
  return `Er liegt im ${sub} (${einfach}) von Wien.`;
}

// ---------- Die Karte ----------
const NS = "http://www.w3.org/2000/svg";
const FULL = [0, 0, MAP.w, MAP.h];
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

class Karte {
  constructor(host, { set, onTap, zoomable = set === "alle", hideLabels = false }) {
    this.host = host; this.set = set; this.ns = new Set(SETS[set].ns); this.onTap = onTap; this.zoomable = zoomable;
    host.classList.add("karte"); host.innerHTML = "";
    const svg = this.svg = el("svg", { preserveAspectRatio: "xMidYMid meet", "aria-label": "Karte der Wiener Bezirke", role: "img" });
    const gD = el("g", {}, svg), gR = el("g", {}, svg), gT = el("g", {}, svg), gL = el("g", {}, svg);
    this.gTop = gT;
    this.p = {}; this.t = {};
    for (let n = 1; n <= 23; n++) {
      const off = !this.ns.has(n);
      this.p[n] = el("path", { d: MAP.d[n].p, class: "bz" + (off ? " off" : ""), "data-n": n }, gD);
      this.t[n] = el("text", { class: "lb" + (off ? " off" : "") + (hideLabels && !off ? " hide" : "") }, gL);
      this.t[n].textContent = n;
    }
    MAP.donau.forEach(d => el("path", { d, class: "river", "stroke-width": "4.5px" }, gR));
    MAP.kanal.forEach(d => el("path", { d, class: "river", "stroke-width": "2.5px" }, gR));
    this.flabel = el("text", { class: "fl", transform: "translate(694 462) rotate(46.8)", "text-anchor": "middle" }, gL);
    this.flabel.textContent = "Donau";
    host.appendChild(svg);
    this.toastEl = document.createElement("div"); this.toastEl.className = "toast"; host.appendChild(this.toastEl);
    if (zoomable) {
      this.zb = document.createElement("button"); this.zb.className = "zoom"; host.appendChild(this.zb);
      this.zb.addEventListener("click", () => this.setView(this.view === "full" ? "inner" : "full"));
    }
    svg.addEventListener("click", e => {
      const t = e.target.closest && e.target.closest("[data-n]");
      if (!t) return;
      const n = +t.dataset.n;
      if (!this.ns.has(n)) return;
      if (this.zoomable && this.view === "full" && n <= 9 && !this.noAutoZoom) { this.setView("inner"); return; }
      this.onTap && this.onTap(n);
    });
    this.view = set === "innen" ? "inner" : "full";
    this.vb = this.target();
    this.apply();
    const ro = new ResizeObserver(() => this.apply());
    ro.observe(host);
    cleanups.push(() => ro.disconnect());
  }
  target() { return this.view === "inner" ? MAP.inner.slice() : FULL.slice(); }
  setView(v, animate = true) {
    if (this.set === "innen") v = "inner";
    if (this.set === "aussen") v = "full";
    if (v === this.view) return;
    this.view = v;
    const from = this.vb.slice(), to = this.target();
    if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { this.vb = to; this.apply(); return; }
    const t0 = performance.now(), dur = 380;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      this.vb = from.map((a, i) => a + (to[i] - a) * e);
      this.apply();
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  focus(n) { if (this.zoomable) this.setView(n <= 9 ? "inner" : "full"); }
  apply() {
    const [x, y, w, h] = this.vb;
    this.svg.setAttribute("viewBox", `${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`);
    const W = this.host.clientWidth || 360, H = this.host.clientHeight || 280;
    const sc = Math.min(W / w, H / h); // Pixel pro Karteneinheit
    // sichtbarer Bereich in Karteneinheiten
    const vw = W / sc, vh = H / sc, vx = x + w / 2 - vw / 2, vy = y + h / 2 - vh / 2;
    const inner = w < 600;
    for (let n = 1; n <= 23; n++) {
      const d = MAP.d[n];
      let [lx, ly] = d.l, r = d.r;
      if (inner && d.li) { [lx, ly] = d.li; r = Math.min(r, d.ri); }
      const visible = lx > vx + 4 && lx < vx + vw - 4 && ly > vy + 4 && ly < vy + vh - 4;
      const px = Math.max(10, Math.min(18, r * sc * 1.25));
      const fs = px / sc;
      const t = this.t[n];
      t.setAttribute("x", lx.toFixed(1)); t.setAttribute("y", ly.toFixed(1));
      t.setAttribute("font-size", fs.toFixed(2)); t.setAttribute("stroke-width", (fs * 0.22).toFixed(2));
      t.style.visibility = visible ? "" : "hidden";
    }
    const fpx = 12 / sc;
    this.flabel.setAttribute("font-size", fpx.toFixed(2));
    this.flabel.style.visibility = inner ? "hidden" : "";
    if (this.zb) this.zb.textContent = this.view === "full" ? "🔍 Innenstadt" : "↩ Ganz Wien";
  }
  cls(n, c, on = true) { this.p[n].classList.toggle(c, on); if (on && /target|sel|ok|bad/.test(c)) this.gTop.appendChild(this.cloneTop(n)); else if (!on) this.dropTop(n); }
  cloneTop(n) { this.dropTop(n); const c = el("path", { d: MAP.d[n].p, class: "top-bz", fill: "none", "vector-effect": "non-scaling-stroke", "data-top": n, "pointer-events": "none" }); return c; }
  dropTop(n) { this.gTop.querySelectorAll(`[data-top="${n}"]`).forEach(e => e.remove()); }
  reset() {
    for (let n = 1; n <= 23; n++) { this.p[n].classList.remove("target", "sel", "ok", "bad", "glow", "done", "blink"); this.p[n].style.fill = ""; }
    this.gTop.innerHTML = "";
  }
  label(n, show) { this.t[n].classList.toggle("hide", !show); }
  fill(n, c) { this.p[n].style.fill = c || ""; }
  flash(n, c, ms = 900) { this.cls(n, c); setTimeout(() => { if (this.p[n]) { this.p[n].classList.remove(c); this.dropTop(n); } }, ms); }
  toast(msg, ms = 2000) {
    this.toastEl.textContent = msg; this.toastEl.classList.add("on");
    clearTimeout(this._tt); this._tt = setTimeout(() => this.toastEl.classList.remove("on"), ms);
  }
}

// ---------- Quiz ----------
function makeRound(set, kind) {
  const ns = SETS[set].ns;
  const sc = n => ((S.due[n] ?? 0) <= S.q ? 0 : 8) + lv(n) * 3 + Math.random() * 5;
  const sorted = ns.map(n => [n, sc(n)]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
  const pick = sorted.slice(0, Math.min(10, ns.length));
  let k = 0; while (pick.length < 10) pick.push(sorted[k++ % sorted.length]);
  // mischen, aber nie zweimal derselbe hintereinander
  for (let tries = 0; tries < 50; tries++) { shuffle(pick); if (pick.every((n, i) => i === 0 || n !== pick[i - 1])) break; }
  return pick.map(n => {
    let dir = kind;
    if (kind === "mix") { dir = Math.random() < .5 ? "zn" : "nk"; }
    return { n, dir };
  });
}
function record(n, firstTry, hinted) {
  S.q++;
  let l = lv(n);
  if (firstTry && !hinted) l = Math.min(3, l + 1);
  else if (!firstTry) l = Math.max(0, l - 1);
  S.lv[n] = l;
  S.due[n] = S.q + [1, 3, 7, 16][l];
  save();
}

function quiz(kind) {
  clearScreen();
  const set = S.set, ns = SETS[set].ns;
  const queue = makeRound(set, kind);
  const before = ns.reduce((a, n) => a + lv(n), 0);
  let i = 0, right = 0, extra = 0, results = [];
  app.innerHTML = `
    <div class="top"><button class="x" aria-label="Zurück">✕</button><div class="dots" id="dots"></div></div>
    <div id="m"></div>
    <div class="panel" id="p"></div>`;
  $(".x").onclick = home;
  let onTap = null;
  const map = new Karte($("#m"), { set, onTap: n => onTap && onTap(n) });
  const dots = () => { $("#dots").innerHTML = queue.map((_, k) => `<i class="${results[k] || (k === i ? "now" : "")}"></i>`).join(""); };

  function next() {
    if (i >= queue.length) return ende();
    map.reset(); onTap = null;
    if (map.zoomable) map.setView("full", false);
    dots();
    const it = queue[i];
    (it.dir === "zn" ? askZN : askNK)(it.n);
  }
  function finish(n, tries, hints) {
    const first = tries === 0;
    record(n, first, hints > 0);
    results[i] = first ? (hints ? "half" : "ok") : "bad";
    if (first && !hints) right++;
    // Fehler kommen in derselben Runde nochmal dran
    if (!first && extra < 3) {
      const at = Math.min(queue.length, i + 3);
      queue.splice(at, 0, { n, dir: queue[i].dir === "zn" ? "nk" : "zn" });
      extra++;
    }
    dots();
  }
  function feedback(n, ok, tries, hints) {
    const box = $("#fb");
    const l = lv(n);
    const head = ok ? (tries === 0 ? (hints ? "Richtig – mit Tipp!" : "Richtig!") : "Jetzt stimmt’s!") : "Das war schwer.";
    box.innerHTML = `
      <div class="fb ${ok && tries === 0 ? "ok" : "bad"}"><b>${ok && tries === 0 ? "✓ " : ""}${head}</b> <span class="st">${STARS(l)}</span><br>
      ${B[n].m}</div>
      <button class="go" id="weiter">Weiter →</button>`;
    $("#weiter").onclick = () => { i++; next(); };
    $("#weiter").scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  // Zahl → Name
  function askZN(n) {
    const pool = ns.filter(x => x !== n);
    const nb = shuffle(MAP.d[n].nb.filter(x => pool.includes(x)));
    const near = shuffle(pool.filter(x => Math.abs(x - n) === 1));
    const ch = new Set();
    if (nb[0]) ch.add(nb[0]);
    if (near[0]) ch.add(near[0]);
    for (const x of shuffle(pool.slice())) { if (ch.size >= 3) break; ch.add(x); }
    const opts = shuffle([n, ...[...ch].slice(0, 3)]);
    map.cls(n, "target"); map.focus(n);
    let tries = 0, hints = 0, done = false;
    $("#p").innerHTML = `
      <div class="ask">Wie heißt der <span class="big">${n}.</span> Bezirk?</div>
      <div class="opts">${opts.map(o => `<button class="opt" data-o="${o}">${B[o].name}</button>`).join("")}</div>
      <div class="row" id="hr"><button class="hint-btn" id="hb">💡 Tipp</button><div class="hint" id="hint"></div></div>
      <div id="fb"></div>`;
    $("#hb").onclick = () => {
      hints++;
      if (hints === 1) $("#hint").textContent = B[n].f;
      if (hints >= 2) {
        const L = B[n].name[0];
        $("#hint").innerHTML = `${B[n].f}<br><b>Er fängt mit „${L}“ an.</b>`;
        // zwei falsche Antworten ausblenden, zuerst die mit anderem Anfangsbuchstaben
        const wrong = opts.filter(o => o !== n && !$(`[data-o="${o}"]`).classList.contains("bad"));
        wrong.sort((a, b) => (B[a].name[0] === L) - (B[b].name[0] === L));
        wrong.slice(0, 2).forEach(o => $(`[data-o="${o}"]`).classList.add("gone"));
        $("#hb").disabled = true;
      }
    };
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (done) return;
      const o = +b.dataset.o;
      if (o === n) {
        done = true; b.classList.add("ok"); map.cls(n, "target", false); map.cls(n, "ok");
        tone("ok"); finish(n, tries, hints); sayB(n); end(true);
      } else {
        tries++; b.classList.add("bad"); b.disabled = true; tone("bad");
        map.flash(o, "bad", 1600); map.toast(`${B[o].name} ist der ${o}.`, 1800);
        if (tries >= 2) {
          done = true;
          const c = $(`[data-o="${n}"]`); c.classList.remove("gone"); c.classList.add("ok");
          map.cls(n, "target", false); map.cls(n, "ok");
          finish(n, tries, hints); setTimeout(() => sayB(n), 400); end(false);
        }
      }
    });
    function end(ok) { $("#hr").style.display = "none"; app.querySelectorAll(".opt").forEach(x => x.disabled = true); feedback(n, ok, tries, hints); }
  }

  // Name → Karte
  function askNK(n) {
    let tries = 0, hints = 0, done = false;
    $("#p").innerHTML = `
      <div class="ask"><span>Wo ist <span class="nm">${B[n].name}</span>?</span><button class="say" aria-label="Vorlesen">🔊</button></div>
      <div class="row" id="hr"><button class="hint-btn" id="hb">💡 Tipp</button><div class="hint" id="hint"></div></div>
      <div id="fb"></div>`;
    $(".say").onclick = () => { const t = S.ton; S.ton = true; say(B[n].name); S.ton = t; };
    say("Wo ist " + B[n].name + "?");
    $("#hb").onclick = () => {
      hints++;
      if (hints === 1) $("#hint").textContent = B[n].f + " " + richtung(n);
      if (hints >= 2) {
        $("#hint").innerHTML = `${B[n].f} ${richtung(n)}<br><b>Er ist einer der leuchtenden Bezirke.</b>`;
        const g = [n, ...MAP.d[n].nb].filter(x => map.ns.has(x));
        // nur ein paar Nachbarn, damit es nicht zu leicht wird
        const show = [n, ...shuffle(g.filter(x => x !== n)).slice(0, 3)];
        show.forEach(x => map.cls(x, "glow"));
        map.focus(n);
        $("#hb").disabled = true;
      }
    };
    onTap = t => {
      if (done) return;
      if (t === n) {
        done = true; app.querySelectorAll(".bz.glow").forEach(p => p.classList.remove("glow"));
        map.cls(n, "ok"); tone("ok"); finish(n, tries, hints); sayB(n); end(true);
      } else {
        tries++; tone("bad");
        map.flash(t, "bad", 1500); map.toast(`Das ist der ${t}.: ${B[t].name}`, 1900);
        if (tries >= 2) {
          done = true; app.querySelectorAll(".bz.glow").forEach(p => p.classList.remove("glow"));
          setTimeout(() => { map.focus(n); map.cls(n, "ok"); map.p[n].classList.add("blink"); }, 700);
          finish(n, tries, hints); setTimeout(() => sayB(n), 900); end(false);
        }
      }
    };
    function end(ok) { $("#hr").style.display = "none"; feedback(n, ok, tries, hints); }
  }

  function ende() {
    clearScreen();
    S.runden++; save();
    const after = ns.reduce((a, n) => a + lv(n), 0);
    const total = queue.length;
    const gain = after - before;
    tone("win");
    app.innerHTML = `
      <div class="top"><button class="x" aria-label="Zurück">✕</button><h2></h2></div>
      <div class="end">
        <div class="big">${right >= total - 1 ? "🏆" : right >= total / 2 ? "🎉" : "💪"}</div>
        <h2>${right >= total - 1 ? "Super gemacht!" : right >= total / 2 ? "Gut gemacht!" : "Weiter so!"}</h2>
        <p class="res">${right} von ${total} gleich richtig</p>
        <p>${gain > 0 ? `+${gain} neue Sterne ★` : "Übung macht den Meister."}</p>
      </div>
      <div id="m"></div>
      <div class="panel">
        <p class="tip" style="padding:4px 6px">Jeden Tag eine kurze Runde hilft am meisten. Morgen wieder!</p>
        <button class="go" id="again">Noch eine Runde</button>
        <button class="go sec" id="fertig">Fertig</button>
      </div>`;
    const map = new Karte($("#m"), { set, onTap: n => lern(n) });
    for (const n of ns) map.fill(n, LV_COL[lv(n)]);
    $(".x").onclick = home; $("#fertig").onclick = home; $("#again").onclick = () => quiz(kind);
  }
  next();
}

// ---------- Der Reihe nach ----------
function reihe() {
  clearScreen();
  const set = S.set, ns = SETS[set].ns;
  const best = S.best[set];
  app.innerHTML = `
    <div class="top"><button class="x" aria-label="Zurück">✕</button><h2>Der Reihe nach</h2><div class="clock" id="clock">0:00.0</div></div>
    <div id="m"></div>
    <div class="panel" id="p">
      <div class="tip">Tippe die Bezirke von <b>${ns[0]}</b> bis <b>${ns[ns.length - 1]}</b> der Reihe nach an.<br>Die Zahlen sind versteckt!<br>${best ? "Bestzeit: <b>" + fmt(best) + "</b>" : "Jeder Fehler kostet 2 Sekunden."}</div>
      <button class="go" id="los">Los!</button>
    </div>`;
  $(".x").onclick = home;
  let k = 0, t0 = 0, pen = 0, fehler = 0, wrongHere = 0, running = false, timer = null;
  const map = new Karte($("#m"), { set, hideLabels: true, onTap: n => tap(n) });
  const clock = () => { $("#clock").textContent = fmt(performance.now() - t0 + pen); };
  cleanups.push(() => clearInterval(timer));
  $("#los").onclick = () => {
    running = true; t0 = performance.now(); timer = setInterval(clock, 100);
    ask();
  };
  function ask() {
    const n = ns[k]; wrongHere = 0;
    $("#p").innerHTML = `<div class="ask"><span>Wo ist der <span class="big">${n}.</span>?</span></div><div class="tip" style="padding:0;font-size:18px">${B[n].name}</div><div id="info" class="tip" style="padding:4px"></div>`;
    if (map.zoomable && n === 10) map.setView("full");
  }
  function tap(n) {
    if (!running) return;
    const want = ns[k];
    if (n === want) {
      map.p[n].classList.remove("glow"); map.cls(n, "done"); map.label(n, true); tone("ok");
      k++;
      if (k >= ns.length) return fertig();
      ask();
    } else if (ns.indexOf(n) < k) {
      map.toast(`Das ist der ${n}. – den hast du schon!`, 1300);
    } else {
      fehler++; wrongHere++; pen += 2000; tone("bad");
      map.flash(n, "bad", 600); map.toast(`Das ist der ${n}.  (+2 s)`, 1300);
      if (wrongHere >= 2) { map.focus(want); map.cls(want, "glow"); setTimeout(() => map.p[want] && map.p[want].classList.remove("glow"), 2500); }
      clock();
    }
  }
  function fertig() {
    running = false; clearInterval(timer);
    const ms = performance.now() - t0 + pen;
    const rekord = !best || ms < best;
    if (rekord) { S.best[set] = ms; save(); }
    tone("win");
    $("#clock").textContent = fmt(ms);
    $("#p").innerHTML = `
      <div class="end"><div class="big">${rekord ? "🏆" : "🎉"}</div>
        <h2>${rekord ? (best ? "Neuer Rekord!" : "Geschafft!") : "Geschafft!"}</h2>
        <p class="res">${fmt(ms)}${fehler ? ` · ${fehler} Fehler` : " · ohne Fehler!"}</p>
        ${!rekord ? `<p>Bestzeit: ${fmt(best)}</p>` : ""}
      </div>
      <button class="go" id="again">Nochmal</button>
      <button class="go sec" id="fertig">Fertig</button>`;
    $("#again").onclick = reihe; $("#fertig").onclick = home;
  }
}

home();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
