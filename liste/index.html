<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Liste">
<meta name="theme-color" content="#f7f4ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Liste</title>
<style>
/* Ein Notizblatt: oben Titel und Stand, darunter die Einträge zum Abhaken */
:root {
  --paper: #f7f4ec;
  --sheet: #fffdf8;
  --line: #e6e0d2;
  --text: #23302a;
  --muted: #7b847e;
  --green: #2f6b4f;
  --orange: #d9822b;
  --chip: #ece7da;
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161a18; --sheet: #1e2320; --line: #2d3430; --text: #e8ece9; --muted: #8e9892;
    --green: #6cc39a; --orange: #f0a25a; --chip: #262c29; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161a18; --sheet: #1e2320; --line: #2d3430; --text: #e8ece9; --muted: #8e9892;
  --green: #6cc39a; --orange: #f0a25a; --chip: #262c29; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--text); font-family: var(--f); font-size: 19px;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 34px; line-height: 1.1; margin: 8px 0 2px; letter-spacing: -.02em; }
.count { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.status { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; min-height: 28px; }
.status button { appearance: none; border: 0; background: none; color: var(--green); font: inherit; padding: 4px 0; cursor: pointer; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 10px -16px 4px; padding: 0 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  appearance: none; border: 0; background: var(--chip); color: var(--text); font: inherit; font-size: 15px;
  padding: 7px 14px; border-radius: 999px; white-space: nowrap; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--green); color: var(--sheet); }
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; margin-top: 12px; overflow: hidden; }
.group { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 16px 16px 6px; }
.item {
  display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; text-align: left;
  appearance: none; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit;
  padding: 14px 16px; min-height: 56px; cursor: pointer;
}
.group + .item, .sheet > .item:first-child { border-top: 0; }
.box {
  flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--green); box-sizing: border-box;
  display: grid; place-items: center; transition: background .15s;
}
.box svg { width: 18px; height: 18px; opacity: 0; transition: opacity .15s; }
.item.done .box { background: var(--green); }
.item.done .box svg { opacity: 1; }
.txt { flex: 1; min-width: 0; }
.note { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
.item.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--orange); text-decoration-thickness: 2px; }
.empty { padding: 28px 18px; color: var(--muted); text-align: center; line-height: 1.5; }
.reset {
  display: block; margin: 22px auto 0; appearance: none; border: 1px solid var(--line); background: transparent;
  color: var(--muted); font: inherit; font-size: 15px; padding: 10px 18px; border-radius: 999px; cursor: pointer;
}
.hint { color: var(--muted); font-size: 14px; text-align: center; margin-top: 26px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Liste</h1>
    <span class="count" id="count"></span>
  </header>
  <div class="status"><span id="stand">Lade …</span><button id="reload" type="button">Neu laden</button></div>
  <nav class="chips" id="chips" hidden></nav>
  <main class="sheet" id="sheet"></main>
  <button class="reset" id="reset" type="button" hidden>Häkchen zurücksetzen</button>
  <p class="hint" id="hint" hidden>Sag Claude, was auf die Liste soll.<br>Sie erscheint hier beim nächsten Öffnen.</p>
</div>
<script>
// Die Listen liegen als listen.json im Branch "liste-daten" des Repos; Claude schreibt sie dort hin.
const REPO = "mathiasbeiglboeck/sascha-rechnen", BRANCH = "liste-daten", FILE = "listen.json";
const SOURCES = [
  () => fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}?ref=${BRANCH}&t=${Date.now()}`,
    { cache: "no-store", headers: { Accept: "application/vnd.github.raw+json" } }),
  () => fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${FILE}?t=${Date.now()}`, { cache: "no-store" })
];
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let data = store.get("liste:daten", null);
let loadedAt = store.get("liste:geladen", 0);
let current = null;      // id der angezeigten Liste
let picked = false;      // hat Mathias in dieser Sitzung selbst eine Liste gewählt?

// Häkchen gelten pro Liste und "runde": startet Claude eine neue Runde, sind alle Häkchen weg
const tickKey = l => `liste:haken:${l.id}:${l.runde || ""}`;
const entries = l => (l.eintraege || []).map(e => typeof e === "string" ? { text: e } : e);

function render() {
  const lists = (data && data.listen) || [];
  if (!picked || !lists.some(l => l.id === current)) {
    current = (data && lists.some(l => l.id === data.aktuell)) ? data.aktuell : (lists[0] && lists[0].id);
  }
  const list = lists.find(l => l.id === current);

  const chips = $("chips");
  chips.replaceChildren();
  chips.hidden = lists.length < 2;
  for (const l of lists) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = l.titel;
    b.setAttribute("aria-pressed", l.id === current);
    b.onclick = () => { current = l.id; picked = true; render(); };
    chips.append(b);
  }

  const sheet = $("sheet");
  sheet.replaceChildren();
  $("title").textContent = list ? list.titel : "Liste";
  document.title = list ? list.titel : "Liste";
  if (!list || !entries(list).length) {
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = data ? "Noch nichts auf der Liste." : "Noch keine Liste geladen.";
    sheet.append(p);
    $("count").textContent = ""; $("reset").hidden = true; $("hint").hidden = false;
    return;
  }
  $("hint").hidden = true;

  const ticks = new Set(store.get(tickKey(list), []));
  const items = entries(list);
  let group;
  for (const e of items) {
    if ((e.gruppe || "") !== (group || "")) {
      group = e.gruppe || "";
      if (group) { const g = document.createElement("div"); g.className = "group"; g.textContent = group; sheet.append(g); }
    }
    const b = document.createElement("button");
    b.type = "button";
    b.className = "item" + (ticks.has(e.text) ? " done" : "");
    b.innerHTML = '<span class="box"><svg viewBox="0 0 20 20" fill="none" stroke="var(--sheet)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg></span><span class="txt"></span>';
    const t = b.querySelector(".txt");
    t.textContent = e.text;
    if (e.notiz) { const n = document.createElement("span"); n.className = "note"; n.textContent = e.notiz; t.append(n); }
    b.onclick = () => {
      ticks.has(e.text) ? ticks.delete(e.text) : ticks.add(e.text);
      store.set(tickKey(list), [...ticks]);
      render();
    };
    sheet.append(b);
  }
  const done = items.filter(e => ticks.has(e.text)).length;
  $("count").textContent = `${done} / ${items.length}`;
  $("reset").hidden = done === 0;
  $("reset").onclick = () => { store.set(tickKey(list), []); render(); };
}

function showStand(text) {
  if (text) { $("stand").textContent = text; return; }
  if (!loadedAt) { $("stand").textContent = "Noch nicht geladen"; return; }
  const min = Math.round((Date.now() - loadedAt) / 60000);
  $("stand").textContent = min < 1 ? "Aktuell" : `Offline · Stand von vor ${min < 60 ? min + " Min." : Math.round(min / 60) + " Std."}`;
}

let loading = false;
async function load() {
  if (loading) return;
  loading = true;
  showStand("Lade …");
  for (const src of SOURCES) {
    try {
      const r = await src();
      if (!r.ok) continue;
      const d = await r.json();
      if (!d || !Array.isArray(d.listen)) continue;
      // Neue "aktuell"-Liste von Claude soll sofort vorne sein
      if (!data || d.aktuell !== data.aktuell) picked = false;
      data = d; loadedAt = Date.now();
      store.set("liste:daten", data); store.set("liste:geladen", loadedAt);
      render(); showStand("Aktuell");
      loading = false;
      return;
    } catch {}
  }
  loading = false;
  showStand();
}

$("reload").onclick = load;
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
render(); showStand(); load();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
