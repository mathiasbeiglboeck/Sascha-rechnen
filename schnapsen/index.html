<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schnapsen">
<meta name="theme-color" content="#f3efe4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Schnapsen</title>
<style>
/* Ein Schreibblock: oben die Spieler, darunter die beiden Teams mit Stand, dann die Punkte-Tasten */
:root {
  --paper: #f3efe4;
  --sheet: #fffdf7;
  --line: #e3dccb;
  --text: #24261f;
  --muted: #7c7b70;
  --a: #2f6b4f;
  --a-soft: #dcebe2;
  --b: #a8402f;
  --b-soft: #f4ddd6;
  --chip: #e9e3d4;
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151714; --sheet: #1e211d; --line: #30342e; --text: #ebede8; --muted: #8f958c;
    --a: #6cc39a; --a-soft: #233a2e; --b: #ef8a74; --b-soft: #42271f; --chip: #2a2e28; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151714; --sheet: #1e211d; --line: #30342e; --text: #ebede8; --muted: #8f958c;
  --a: #6cc39a; --a-soft: #233a2e; --b: #ef8a74; --b-soft: #42271f; --chip: #2a2e28; color-scheme: dark;
}
[hidden] { display: none !important; }
sub { line-height: 0; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--text); font-family: var(--f); font-size: 18px;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
button { appearance: none; border: 0; font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 520px; margin: 0 auto; padding: 14px 16px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 28px; margin: 4px 0; letter-spacing: -.02em; }
.link { background: none; color: var(--muted); font-size: 15px; padding: 6px 2px; }
.link:disabled { opacity: .35; }
.hint { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }

/* Spieler: Antippen wechselt  – → A → B → – */
.players { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.p {
  position: relative; height: 46px; border-radius: 12px; background: var(--chip); font-weight: 700; font-size: 19px;
  display: flex; align-items: center; justify-content: center;
}
.p sub { font-size: 11px; font-weight: 600; margin-left: 1px; }
.p.A { background: var(--a); color: var(--sheet); }
.p.B { background: var(--b); color: var(--sheet); }
.p .bu { position: absolute; top: -6px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
  background: var(--text); color: var(--paper); font-size: 11px; line-height: 18px; font-weight: 700; }

/* Teams */
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.team {
  background: var(--sheet); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px 12px; text-align: left;
  display: flex; flex-direction: column; min-height: 132px;
}
.team .who { font-weight: 700; font-size: 17px; min-height: 22px; }
.team .tot { font-size: 52px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.team .rest { color: var(--muted); font-size: 14px; }
.team .log { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.35; word-break: break-word; font-variant-numeric: tabular-nums; }
.team.A .who, .team.A .tot { color: var(--a); }
.team.B .who, .team.B .tot { color: var(--b); }
.team.A.sel { border-color: var(--a); background: var(--a-soft); }
.team.B.sel { border-color: var(--b); background: var(--b-soft); }
/* 3er: jeder Spieler eine eigene Karte; wer punktet, wird vor jeder Eingabe angetippt */
.teams.drei { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.drei .team { padding: 10px 10px 12px; min-height: 120px; }
.drei .team .tot { font-size: 42px; }
.drei .team.sel { border-color: var(--text); background: var(--chip); }
.p.C { background: var(--text); color: var(--paper); }

/* Umschalter 4er / 3er */
.modus { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.modus button { background: none; border-radius: 8px; padding: 6px 12px; font-size: 15px; font-weight: 600; color: var(--muted); }
.modus button[aria-pressed="true"] { background: var(--sheet); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Punkte-Tasten: links einfach, rechts doppelt */
.pad { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.pad h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px 2px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.k {
  height: 54px; border-radius: 12px; background: var(--sheet); border: 1px solid var(--line);
  font-size: 23px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.k:active { transform: scale(.96); }
.dbl .k { background: var(--chip); }
.pad.off { opacity: .4; pointer-events: none; }

.bar { display: flex; gap: 10px; margin-top: 14px; }
.btn { flex: 1; height: 50px; border-radius: 14px; background: var(--chip); font-weight: 600; font-size: 17px; }
.btn:disabled { opacity: .4; }
.btn.go { background: var(--text); color: var(--paper); }

/* Ergebnis einer Partie */
.result { background: var(--sheet); border: 2px solid var(--text); border-radius: 16px; padding: 14px 16px; margin-top: 14px; }
.result b { font-size: 22px; display: block; margin-bottom: 4px; }
.result p { margin: 4px 0 12px; color: var(--muted); font-size: 16px; }

/* Verlauf und Bummerl-Stand */
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; margin-top: 18px; overflow: hidden; }
.sheet h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 14px 16px 6px; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 16px; }
.row:first-of-type { border-top: 0; }
.row span:first-child { min-width: 0; }
.row .m { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stand { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; padding: 4px 8px 12px; }
.stand div { text-align: center; padding: 6px 0; }
.stand .n { font-weight: 700; font-size: 17px; }
.stand .c { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stand .c.z { color: var(--muted); font-weight: 400; }
.empty { color: var(--muted); font-size: 15px; padding: 4px 16px 14px; }
.foot { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--text); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: .95; }
@media (max-width: 370px) { h1 { font-size: 23px; } .modus button { padding: 6px 9px; } .k { height: 48px; font-size: 20px; } .team .tot { font-size: 44px; } .p { font-size: 17px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Schnapsen</h1>
    <div class="modus" role="group" aria-label="Spielart">
      <button data-m="4">4er</button><button data-m="3">3er</button>
    </div>
    <button class="link" id="undo">↶ Zurück</button>
  </header>
  <div class="hint" id="hint"></div>
  <div class="players" id="players"></div>

  <div class="teams" id="teams"></div>

  <div class="result" id="result" hidden>
    <b id="resTitle"></b>
    <p id="resText"></p>
    <button class="btn go" id="next" style="width:100%">Neue Partie</button>
  </div>

  <div class="pad" id="pad">
    <div><h2>einfach</h2><div class="grid" id="g1"></div></div>
    <div class="dbl"><h2>doppelt</h2><div class="grid" id="g2"></div></div>
  </div>

  <div class="sheet">
    <h3>Bummerl</h3>
    <div class="stand" id="stand"></div>
  </div>

  <div class="sheet">
    <h3>Partien</h3>
    <div id="hist"></div>
  </div>

  <div class="foot">
    <button class="link" id="abort">Partie abbrechen</button>
    <button class="link" id="reset">Alles löschen</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ZIEL = 24;
const WERTE = [1, 2, 3, 5, 6, 8, 9, 10, 12];
const SPIELER = [
  { id: "S", n: "S" }, { id: "M1", n: "M", s: "1" }, { id: "M2", n: "M", s: "2" }, { id: "L", n: "L" },
  { id: "T", n: "T" }, { id: "P", n: "P" }, { id: "E", n: "E" }, { id: "H", n: "H" }
];
const KEY = "schnapsen-v1";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// Zustand. Jede Eingabe merkt sich, welche Spieler die Punkte bekommen: beim 4er das ganze Team,
// beim 3er entweder der Alleinspieler oder seine zwei Gegner. Gezählt wird pro Spieler.
const leer = () => ({
  modus: "4",
  team: {}, sel: "A",      // 4er: Teamzuordnung, gewähltes Team
  mit: [], wahl: [],       // 3er: wer mitspielt, wer die nächsten Punkte bekommt
  partie: [],              // [{ ids: [...], w }]
  ende: null,
  bummerl: Object.fromEntries(SPIELER.map(p => [p.id, 0])),
  partien: []
});
// Ältere Speicherstände: Partie lag als Punkte je Team vor
function auffrischen(s) {
  s = Object.assign(leer(), s);
  if (s.partie && !Array.isArray(s.partie)) {
    const alt = s.partie, neu = [];
    ["A", "B"].forEach(t => (alt[t] || []).forEach(w => neu.push({ ids: Object.keys(s.team).filter(i => s.team[i] === t), w })));
    s.partie = neu;
  }
  return s;
}
let st = auffrischen(store.get(KEY, {}));
let undo = store.get(KEY + "-undo", []);

function save() { store.set(KEY, st); store.set(KEY + "-undo", undo.slice(-150)); }
function merk() { undo.push(JSON.stringify(st)); if (undo.length > 150) undo.shift(); }
const name = id => { const p = SPIELER.find(x => x.id === id); return p ? p.n + (p.s ? p.s : "") : id; };
const namen = ids => ids.map(name).join(" · ");
const mitglieder = t => SPIELER.filter(p => st.team[p.id] === t).map(p => p.id);
const drei = () => st.modus === "3";
// Punkte einer Gruppe: jede Eingabe zählt einmal, wenn sie einen der Spieler betrifft
const punkte = ids => st.partie.filter(e => e.ids.some(i => ids.includes(i))).reduce((a, e) => a + e.w, 0);
const posten = ids => st.partie.filter(e => e.ids.some(i => ids.includes(i))).map(e => e.w);

// Die Karten, auf die man tippt: 4er zwei Teams, 3er drei Spieler
function karten() {
  if (drei()) return SPIELER.filter(p => st.mit.includes(p.id)).map(p => ({ key: p.id, ids: [p.id], cls: "C", titel: name(p.id) }));
  return ["A", "B"].map(t => ({ key: t, ids: mitglieder(t), cls: t, titel: namen(mitglieder(t)) || (t === "A" ? "Team grün" : "Team rot") }));
}
const bereit = () => drei() ? st.mit.length === 3 : mitglieder("A").length > 0 && mitglieder("B").length > 0;

function toast(t) {
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 1800);
}

function tippSpieler(id) {
  if (drei()) {
    if (!st.mit.includes(id) && st.mit.length >= 3) { toast("Beim 3er spielen nur drei mit"); return; }
    merk();
    st.mit = st.mit.includes(id) ? st.mit.filter(x => x !== id) : st.mit.concat(id);
    st.wahl = st.wahl.filter(x => st.mit.includes(x));
  } else {
    merk();
    const jetzt = st.team[id];
    st.team[id] = jetzt === undefined ? "A" : jetzt === "A" ? "B" : undefined;
    if (st.team[id] === undefined) delete st.team[id];
  }
  save(); zeige();
}

function tippKarte(key) {
  if (st.ende) return;
  if (drei()) st.wahl = st.wahl.includes(key) ? st.wahl.filter(x => x !== key) : st.wahl.concat(key);
  else st.sel = key;
  save(); zeige();
}

function eintragen(w) {
  if (st.ende) return;
  if (!bereit()) { toast(drei() ? "Zuerst drei Spieler wählen" : "Zuerst beide Teams wählen"); return; }
  let ids;
  if (drei()) {
    if (!st.wahl.length) { toast("Wer bekommt die Punkte? Spieler antippen"); return; }
    if (st.wahl.length === 3) { toast("Höchstens zwei Spieler antippen"); return; }
    ids = st.wahl.slice();
  } else ids = mitglieder(st.sel);
  merk();
  st.partie.push({ ids, w });
  st.wahl = [];
  pruefeEnde();
  save(); zeige();
}

// Sobald jemand 24 hat, ist die Partie aus: jeder, der darunter liegt, bekommt ein Bummerl, bei 0 Punkten zwei (Schneider)
function pruefeEnde() {
  const ks = karten();
  const sieger = ks.filter(k => punkte(k.ids) >= ZIEL);
  if (!sieger.length) return;
  const verlierer = ks.filter(k => punkte(k.ids) < ZIEL);
  const bu = {};
  verlierer.forEach(k => k.ids.forEach(id => {
    bu[id] = punkte(k.ids) === 0 ? 2 : 1;
    st.bummerl[id] = (st.bummerl[id] || 0) + bu[id];
  }));
  st.ende = { sieger: sieger.map(k => k.key), bu };
  st.partien.unshift({
    zeit: Date.now(),
    text: namen(sieger.flatMap(k => k.ids)) + " vor " + verlierer.map(k => namen(k.ids) + (punkte(k.ids) === 0 ? " (Schneider)" : "")).join(", "),
    stand: ks.map(k => punkte(k.ids)).join(":")
  });
}

function neuePartie() {
  merk();
  st.partie = []; st.ende = null; st.wahl = [];
  save(); zeige();
}

function zeige() {
  document.querySelectorAll(".modus button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === st.modus));

  // Spieler
  const pl = document.getElementById("players");
  pl.innerHTML = "";
  SPIELER.forEach(p => {
    const b = document.createElement("button");
    const cls = drei() ? (st.mit.includes(p.id) ? "C" : "") : (st.team[p.id] || "");
    b.className = "p " + cls;
    b.innerHTML = p.n + (p.s ? "<sub>" + p.s + "</sub>" : "") + (st.bummerl[p.id] ? '<span class="bu">' + st.bummerl[p.id] + "</span>" : "");
    b.setAttribute("aria-label", name(p.id) + (cls ? ", spielt mit" : ", spielt nicht"));
    b.onclick = () => tippSpieler(p.id);
    pl.appendChild(b);
  });

  // Karten
  const tw = document.getElementById("teams");
  tw.className = "teams" + (drei() ? " drei" : "");
  tw.innerHTML = "";
  karten().forEach(k => {
    const s = punkte(k.ids);
    const b = document.createElement("button");
    const gewaehlt = !st.ende && (drei() ? st.wahl.includes(k.key) : st.sel === k.key);
    b.className = "team " + k.cls + (gewaehlt ? " sel" : "");
    b.innerHTML = '<span class="who"></span><span class="tot"></span><span class="rest"></span><span class="log"></span>';
    b.querySelector(".who").textContent = k.titel;
    b.querySelector(".tot").textContent = s;
    b.querySelector(".rest").textContent = s >= ZIEL ? "gewonnen" : "noch " + (ZIEL - s);
    b.querySelector(".log").textContent = posten(k.ids).join(" + ");
    b.onclick = () => tippKarte(k.key);
    tw.appendChild(b);
  });

  // Hinweis
  const hint = document.getElementById("hint");
  hint.textContent = !bereit()
    ? (drei() ? "Die drei Spieler antippen." : "Spieler antippen: einmal Team grün, zweimal Team rot, dreimal raus.")
    : drei() && !st.ende ? "Wer schreibt? Den Alleinspieler antippen, oder seine zwei Gegner. Dann die Punkte." : "";
  hint.hidden = !hint.textContent;

  // Ergebnis
  const res = document.getElementById("result");
  res.hidden = !st.ende;
  document.getElementById("pad").classList.toggle("off", !!st.ende);
  if (st.ende) {
    const bu = st.ende.bu, ids = Object.keys(bu);
    const schneider = ids.some(i => bu[i] === 2);
    const sieger = karten().filter(k => st.ende.sieger.includes(k.key)).flatMap(k => k.ids);
    document.getElementById("resTitle").textContent = (schneider ? "Schneider! " : "Bummerl! ") + namen(sieger) + (sieger.length > 1 ? " gewinnen" : " gewinnt");
    const eins = ids.filter(i => bu[i] === 1), zwei = ids.filter(i => bu[i] === 2);
    const teil = (l, n) => l.map(name).join(" und ") + (l.length > 1 ? " bekommen je " : " bekommt ") + n;
    document.getElementById("resText").textContent = karten().map(k => punkte(k.ids)).join(" : ") + ". " +
      [eins.length ? teil(eins, "1 Bummerl") : "", zwei.length ? teil(zwei, "2 Bummerl") : ""].filter(Boolean).join(", ") + ".";
  }

  // Bummerl-Stand
  document.getElementById("stand").innerHTML = SPIELER.map(p => {
    const c = st.bummerl[p.id] || 0;
    return '<div><div class="n">' + p.n + (p.s ? "<sub>" + p.s + "</sub>" : "") + '</div><div class="c' + (c ? "" : " z") + '">' + c + "</div></div>";
  }).join("");

  // Verlauf
  const h = document.getElementById("hist");
  h.innerHTML = st.partien.length ? "" : '<div class="empty">Noch keine Partie fertig.</div>';
  st.partien.slice(0, 40).forEach(x => {
    const d = document.createElement("div");
    d.className = "row";
    const uhr = new Date(x.zeit).toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
    d.innerHTML = "<span></span><span class='m'></span>";
    d.firstChild.textContent = x.text || (namen(x.sieger) + " vor " + namen(x.verlierer) + (x.schneider ? " (Schneider)" : ""));
    d.lastChild.textContent = (x.stand || x.punkte.join(":")) + "  " + uhr;
    h.appendChild(d);
  });

  document.getElementById("undo").disabled = !undo.length;
  document.getElementById("abort").hidden = !st.partie.length || !!st.ende;
}

// Tasten bauen
[["g1", 1], ["g2", 2]].forEach(([id, f]) => {
  const g = document.getElementById(id);
  WERTE.forEach(w => {
    const b = document.createElement("button");
    b.className = "k"; b.textContent = w * f;
    b.onclick = () => eintragen(w * f);
    g.appendChild(b);
  });
});
document.querySelectorAll(".modus button").forEach(b => b.onclick = () => {
  if (st.modus === b.dataset.m) return;
  if (st.partie.length && !st.ende && !confirm("Laufende Partie abbrechen und wechseln?")) return;
  merk();
  st.modus = b.dataset.m;
  st.partie = []; st.ende = null; st.wahl = [];
  save(); zeige();
});
document.getElementById("undo").onclick = () => {
  if (!undo.length) return;
  st = auffrischen(JSON.parse(undo.pop()));
  save(); zeige(); toast("Rückgängig");
};
document.getElementById("next").onclick = neuePartie;
document.getElementById("abort").onclick = () => { if (confirm("Laufende Partie ohne Bummerl beenden?")) neuePartie(); };
document.getElementById("reset").onclick = () => {
  if (!confirm("Alle Bummerl und den Verlauf löschen? Die Spieler bleiben.")) return;
  merk();
  const { modus, team, mit } = st; st = leer(); Object.assign(st, { modus, team, mit });
  save(); zeige();
};

zeige();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
