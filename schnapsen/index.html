<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schnapsen">
<meta name="theme-color" content="#f3efe4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Schnapsen</title>
<style>
/* Ein Schreibblock: oben die Spieler, darunter die beiden Teams mit Stand, dann die Eingabe eines Spiels */
:root {
  --paper: #f3efe4;
  --sheet: #fffdf7;
  --line: #e3dccb;
  --text: #24261f;
  --muted: #7c7b70;
  --a: #2f6b4f;
  --a-soft: #dcebe2;
  --b: #a8402f;
  --b-soft: #f4ddd6;
  --chip: #e9e3d4;
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151714; --sheet: #1e211d; --line: #30342e; --text: #ebede8; --muted: #8f958c;
    --a: #6cc39a; --a-soft: #233a2e; --b: #ef8a74; --b-soft: #42271f; --chip: #2a2e28; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151714; --sheet: #1e211d; --line: #30342e; --text: #ebede8; --muted: #8f958c;
  --a: #6cc39a; --a-soft: #233a2e; --b: #ef8a74; --b-soft: #42271f; --chip: #2a2e28; color-scheme: dark;
}
[hidden] { display: none !important; }
sub { line-height: 0; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--text); font-family: var(--f); font-size: 18px;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
button { appearance: none; border: 0; font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 520px; margin: 0 auto; padding: 14px 16px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 28px; margin: 4px 0; letter-spacing: -.02em; }
.link { background: none; color: var(--muted); font-size: 15px; padding: 6px 2px; }
.link:disabled { opacity: .35; }
.hint { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }

/* Spieler: Antippen wechselt  – → A → B → – */
.players { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.p {
  position: relative; height: 46px; border-radius: 12px; background: var(--chip); font-weight: 700; font-size: 19px;
  display: flex; align-items: center; justify-content: center;
}
.p sub { font-size: 11px; font-weight: 600; margin-left: 1px; }
.p.A { background: var(--a); color: var(--sheet); }
.p.B { background: var(--b); color: var(--sheet); }
.p .bu { position: absolute; top: -6px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
  background: var(--text); color: var(--paper); font-size: 11px; line-height: 18px; font-weight: 700; }

/* Teams */
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.team {
  background: var(--sheet); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px 12px; text-align: left;
  display: flex; flex-direction: column; min-height: 132px;
}
.team .who { font-weight: 700; font-size: 17px; min-height: 22px; }
.team .tot { font-size: 52px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.team .rest { color: var(--muted); font-size: 14px; }
.team .log { color: var(--muted); font-size: 14px; margin-top: 6px; line-height: 1.35; word-break: break-word; font-variant-numeric: tabular-nums; }
.team.A .who, .team.A .tot { color: var(--a); }
.team.B .who, .team.B .tot { color: var(--b); }
.team.A.sel { border-color: var(--a); background: var(--a-soft); }
.team.B.sel { border-color: var(--b); background: var(--b-soft); }
/* 3er: jeder Spieler eine eigene Karte; wer punktet, wird vor jeder Eingabe angetippt */
.teams.drei { grid-template-columns: repeat(3, 1fr); gap: 8px; }
.drei .team { padding: 10px 10px 12px; min-height: 120px; }
.drei .team .tot { font-size: 42px; }
.drei .team.sel { border-color: var(--text); background: var(--chip); }
.p.C { background: var(--text); color: var(--paper); }

/* Umschalter 4er / 3er */
.modus { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.modus button { background: none; border-radius: 8px; padding: 6px 12px; font-size: 15px; font-weight: 600; color: var(--muted); }
.modus button[aria-pressed="true"] { background: var(--sheet); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Ergebnis einer Partie */
.result { background: var(--sheet); border: 2px solid var(--text); border-radius: 16px; padding: 14px 16px; margin-top: 14px; }
.result b { font-size: 22px; display: block; margin-bottom: 4px; }
.result p { margin: 4px 0 12px; color: var(--muted); font-size: 16px; }

/* Verlauf und Bummerl-Stand */
.sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; margin-top: 18px; overflow: hidden; }
.sheet h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 14px 16px 6px; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); font-size: 16px; }
.row:first-of-type { border-top: 0; }
.row span:first-child { min-width: 0; }
.row .m { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stand { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; padding: 4px 8px 12px; }
.stand div { text-align: center; padding: 6px 0; }
.stand .n { font-weight: 700; font-size: 17px; }
.stand .c { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stand .c.z { color: var(--muted); font-weight: 400; }
.empty { color: var(--muted); font-size: 15px; padding: 4px 16px 14px; }
.foot { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--text); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: .95; }
/* Eingabe eines Spiels: wer spielt, was, wie viel, gespritzt, dann gewonnen oder verloren */
.eingabe { background: var(--sheet); border: 1px solid var(--line); border-radius: 16px; margin-top: 14px; padding: 4px 12px 14px; }
.eingabe h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 2px 6px; }
.reihe { display: flex; flex-wrap: wrap; gap: 6px; }
.w {
  min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--chip); font-size: 17px; font-weight: 600;
  display: inline-flex; align-items: center; justify-content: center;
}
.w sub { font-size: 11px; margin-left: 1px; }
.w[aria-pressed="true"] { background: var(--text); color: var(--paper); }
.wer .w { flex: 1; font-size: 20px; }
.wer .w.A { color: var(--a); } .wer .w.B { color: var(--b); }
.wer .w.A[aria-pressed="true"] { background: var(--a); color: var(--sheet); }
.wer .w.B[aria-pressed="true"] { background: var(--b); color: var(--sheet); }
.zahlen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.zahlen .w { padding: 0; font-variant-numeric: tabular-nums; }
.spritz .w { flex: 1; font-size: 15px; white-space: nowrap; }
.summe { text-align: center; font-size: 17px; margin: 14px 0 10px; min-height: 22px; font-variant-numeric: tabular-nums; }
.summe b { font-size: 22px; }
.ende { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ende .btn { height: 56px; font-size: 19px; color: var(--sheet); }
.ende .gew { background: var(--a); } .ende .ver { background: var(--b); }
.ende .btn:disabled { opacity: .3; }
.eingabe.off { opacity: .4; pointer-events: none; }
.team { cursor: default; }

/* Statistik */
.tabs { display: flex; gap: 6px; margin: 10px 0 4px; }
.stat table { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat th, .stat td { padding: 6px 4px; text-align: right; border-top: 1px solid var(--line); }
.stat th:first-child, .stat td:first-child { text-align: left; }
.stat th { font-weight: 600; color: var(--muted); font-size: 13px; border-top: 0; }
.stat .pad16 { padding: 0 12px 12px; }
.stat .kopf { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 12px 4px; }
.stat .kopf b { font-size: 20px; }
.stat .kopf span { color: var(--muted); font-size: 14px; }
.stat .gw { color: var(--a); } .stat .vl { color: var(--b); }
@media (max-width: 370px) { h1 { font-size: 23px; } .modus button { padding: 6px 9px; } .team .tot { font-size: 44px; } .p { font-size: 17px; } .w { padding: 0 10px; font-size: 15px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Schnapsen</h1>
    <div class="modus" role="group" aria-label="Spielart">
      <button data-m="4">4er</button><button data-m="3">3er</button>
    </div>
    <button class="link" id="undo">↶ Zurück</button>
  </header>

  <main id="block">
    <div class="hint" id="hint"></div>
    <div class="players" id="players"></div>

    <div class="teams" id="teams"></div>

    <div class="result" id="result" hidden>
      <b id="resTitle"></b>
      <p id="resText"></p>
      <button class="btn go" id="next" style="width:100%">Neue Partie</button>
    </div>

    <div class="eingabe" id="eingabe">
      <h2>Wer spielt?</h2>
      <div class="reihe wer" id="wer"></div>
      <h2>Was?</h2>
      <div class="reihe" id="was"></div>
      <div id="punkteNormal">
        <h2>Punkte</h2>
        <div class="zahlen" id="zahlen"></div>
      </div>
      <h2>Gespritzt?</h2>
      <div class="reihe spritz" id="spritz"></div>
      <div class="summe" id="summe"></div>
      <div class="ende">
        <button class="btn gew" id="gew">Gewonnen</button>
        <button class="btn ver" id="ver">Verloren</button>
      </div>
    </div>

    <div class="sheet">
      <h3>Bummerl</h3>
      <div class="stand" id="stand"></div>
    </div>

    <div class="sheet">
      <h3>Partien</h3>
      <div id="hist"></div>
    </div>

    <div class="foot">
      <button class="link" id="zurStat">Statistik</button>
      <button class="link" id="abort">Partie abbrechen</button>
      <button class="link" id="reset">Bummerl löschen</button>
    </div>
  </main>

  <section id="statistik" class="stat" hidden>
    <h2 style="margin:14px 0 0;font-size:22px">Statistik</h2>
    <div class="tabs" id="statTabs"></div>
    <div id="statInhalt"></div>
    <div class="foot">
      <button class="link" id="zumBlock">← Zurück zum Block</button>
      <button class="link" id="statLoeschen">Statistik löschen</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const ZIEL = 24;
const NORMAL = [1, 2, 3];   // nur beim normalen Spiel wählbar, sonst folgt der Wert aus dem Spiel
// Spiele mit ihrem Wert
const SPIELE = [
  { id: "normal", n: "Normal", w: 1 },
  { id: "bettler", n: "Bettler", w: 5 },
  { id: "schnapser", n: "Schnapser", w: 6 },
  { id: "dreiass", n: "3-Ass-Schnapser", w: 6 },
  { id: "sauplauderer", n: "Sauplauderer", w: 8 },
  { id: "gangerl", n: "Gangerl", w: 9 },
  { id: "zehnerloch", n: "Zehnerloch", w: 10 },
  { id: "bauer", n: "Bauer", w: 12 }
];
const SPRITZ = [{ f: 2, n: "gespritzt" }, { f: 4, n: "gegengespritzt" }];
const SPIELER = [
  { id: "S", n: "S" }, { id: "M1", n: "M", s: "1" }, { id: "M2", n: "M", s: "2" }, { id: "L", n: "L" },
  { id: "T", n: "T" }, { id: "P", n: "P" }, { id: "E", n: "E" }, { id: "H", n: "H" }
];
const KEY = "schnapsen-v1";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// Zustand. Jede Eingabe in der Partie merkt sich, welche Spieler die Punkte bekommen: beim 4er das Team,
// beim 3er der Alleinspieler oder seine zwei Gegner. Gezählt wird pro Spieler.
// Alle gespielten Spiele landen zusätzlich in "spiele" für die Statistik.
const leer = () => ({
  modus: "4",
  team: {},                // 4er: Teamzuordnung
  mit: [],                 // 3er: wer mitspielt
  neu: { wer: null, typ: "normal", wert: 1, f: 1 },  // das Spiel, das gerade eingegeben wird
  partie: [],              // [{ ids: [...], w }]
  ende: null,
  bummerl: Object.fromEntries(SPIELER.map(p => [p.id, 0])),
  partien: [],             // neueste zuerst
  spiele: []               // [{ zeit, modus, spieler, wer, typ, wert, f, gewonnen }]
});
// Ältere Speicherstände: Partie lag als Punkte je Team vor
function auffrischen(s) {
  s = Object.assign(leer(), s);
  if (s.partie && !Array.isArray(s.partie)) {
    const alt = s.partie, neu = [];
    ["A", "B"].forEach(t => (alt[t] || []).forEach(w => neu.push({ ids: Object.keys(s.team).filter(i => s.team[i] === t), w })));
    s.partie = neu;
  }
  return s;
}
let st = auffrischen(store.get(KEY, {}));
// Rückgängig merkt sich den Zustand ohne die langen Listen, nur deren Länge
let undo = store.get(KEY + "-undo", []).filter(u => u.includes('"_n"'));
let statModus = st.modus;

function save() { store.set(KEY, st); store.set(KEY + "-undo", undo.slice(-100)); }
function merk() {
  const { spiele, partien, ...rest } = st;
  undo.push(JSON.stringify(Object.assign(rest, { _n: spiele.length, _p: partien.length })));
  if (undo.length > 100) undo.shift();
}
function zurueck() {
  const s = JSON.parse(undo.pop());
  const spiele = st.spiele.slice(0, s._n), partien = st.partien.slice(Math.max(0, st.partien.length - s._p));
  delete s._n; delete s._p;
  st = auffrischen(Object.assign(s, { spiele, partien }));
}
const name = id => { const p = SPIELER.find(x => x.id === id); return p ? p.n + (p.s ? p.s : "") : id; };
const marke = id => { const p = SPIELER.find(x => x.id === id); return p.n + (p.s ? "<sub>" + p.s + "</sub>" : ""); };
const namen = ids => ids.map(name).join(" · ");
const mitglieder = t => SPIELER.filter(p => st.team[p.id] === t).map(p => p.id);
const drei = () => st.modus === "3";
const spielend = () => drei() ? SPIELER.filter(p => st.mit.includes(p.id)).map(p => p.id) : mitglieder("A").concat(mitglieder("B"));
const spielName = id => (SPIELE.find(s => s.id === id) || { n: id }).n;
// Punkte einer Gruppe: jede Eingabe zählt einmal, wenn sie einen der Spieler betrifft
const punkte = ids => st.partie.filter(e => e.ids.some(i => ids.includes(i))).reduce((a, e) => a + e.w, 0);
const posten = ids => st.partie.filter(e => e.ids.some(i => ids.includes(i))).map(e => e.w);
const laeuft = () => st.partie.length > 0 && !st.ende;

// Die Anzeige-Karten: 4er zwei Teams, 3er drei Spieler
function karten() {
  if (drei()) return st.mit.length ? spielend().map(id => ({ key: id, ids: [id], cls: "C", titel: name(id) })) : [];
  return ["A", "B"].map(t => ({ key: t, ids: mitglieder(t), cls: t, titel: namen(mitglieder(t)) || (t === "A" ? "Team grün" : "Team rot") }));
}
const bereit = () => drei() ? st.mit.length === 3 : mitglieder("A").length > 0 && mitglieder("B").length > 0;

function toast(t) {
  const el = document.getElementById("toast");
  el.textContent = t; el.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 1800);
}

function tippSpieler(id) {
  if (laeuft()) { toast("Während der Partie fix. Zum Ändern die Partie abbrechen."); return; }
  if (drei()) {
    if (!st.mit.includes(id) && st.mit.length >= 3) { toast("Beim 3er spielen nur drei mit"); return; }
    merk();
    st.mit = st.mit.includes(id) ? st.mit.filter(x => x !== id) : st.mit.concat(id);
  } else {
    merk();
    const jetzt = st.team[id];
    st.team[id] = jetzt === undefined ? "A" : jetzt === "A" ? "B" : undefined;
    if (st.team[id] === undefined) delete st.team[id];
  }
  if (!spielend().includes(st.neu.wer)) st.neu.wer = null;
  save(); zeige();
}

function waehle(feld, wert) {
  const n = st.neu;
  if (feld === "typ") { n.typ = wert; n.wert = SPIELE.find(s => s.id === wert).w; }
  else if (feld === "f") n.f = n.f === wert ? 1 : wert;
  else n[feld] = n[feld] === wert && feld === "wer" ? null : wert;
  save(); zeige();
}

// Spiel abschließen: Punkte an die Gewinner, Spiel in die Statistik
function abschliessen(gewonnen) {
  const n = st.neu;
  if (st.ende || !bereit() || !n.wer) return;
  merk();
  const w = n.wert * n.f;
  let ids;
  if (drei()) ids = gewonnen ? [n.wer] : spielend().filter(i => i !== n.wer);
  else { const t = st.team[n.wer]; ids = mitglieder(gewonnen ? t : t === "A" ? "B" : "A"); }
  st.partie.push({ ids, w });
  st.spiele.push({ zeit: Date.now(), modus: st.modus, spieler: spielend(), wer: n.wer, typ: n.typ, wert: n.wert, f: n.f, gewonnen });
  st.neu = { wer: null, typ: "normal", wert: 1, f: 1 };
  pruefeEnde();
  save(); zeige();
  toast(namen(ids) + " +" + w);
}

// Sobald jemand 24 hat, ist die Partie aus: jeder, der darunter liegt, bekommt ein Bummerl, bei 0 Punkten zwei (Schneider)
function pruefeEnde() {
  const ks = karten();
  const sieger = ks.filter(k => punkte(k.ids) >= ZIEL);
  if (!sieger.length) return;
  const verlierer = ks.filter(k => punkte(k.ids) < ZIEL);
  const bu = {};
  verlierer.forEach(k => k.ids.forEach(id => {
    bu[id] = punkte(k.ids) === 0 ? 2 : 1;
    st.bummerl[id] = (st.bummerl[id] || 0) + bu[id];
  }));
  st.ende = { sieger: sieger.map(k => k.key), bu };
  st.partien.unshift({
    zeit: Date.now(),
    text: namen(sieger.flatMap(k => k.ids)) + " vor " + verlierer.map(k => namen(k.ids) + (punkte(k.ids) === 0 ? " (Schneider)" : "")).join(", "),
    stand: ks.map(k => punkte(k.ids)).join(":")
  });
}

function neuePartie() {
  merk();
  st.partie = []; st.ende = null; st.neu = { wer: null, typ: "normal", wert: 1, f: 1 };
  save(); zeige();
}

function knopf(html, an, klick, cls) {
  const b = document.createElement("button");
  b.className = "w" + (cls ? " " + cls : "");
  b.innerHTML = html;
  b.setAttribute("aria-pressed", an ? "true" : "false");
  b.onclick = klick;
  return b;
}

function zeige() {
  document.querySelectorAll(".modus button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === st.modus));

  // Spieler
  const pl = document.getElementById("players");
  pl.innerHTML = "";
  SPIELER.forEach(p => {
    const b = document.createElement("button");
    const cls = drei() ? (st.mit.includes(p.id) ? "C" : "") : (st.team[p.id] || "");
    b.className = "p " + cls;
    b.innerHTML = marke(p.id) + (st.bummerl[p.id] ? '<span class="bu">' + st.bummerl[p.id] + "</span>" : "");
    b.setAttribute("aria-label", name(p.id) + (cls ? ", spielt mit" : ", spielt nicht"));
    b.onclick = () => tippSpieler(p.id);
    pl.appendChild(b);
  });

  // Karten mit dem Stand
  const tw = document.getElementById("teams");
  tw.className = "teams" + (drei() ? " drei" : "");
  tw.innerHTML = "";
  karten().forEach(k => {
    const s = punkte(k.ids);
    const d = document.createElement("div");
    d.className = "team " + k.cls;
    d.innerHTML = '<span class="who"></span><span class="tot"></span><span class="rest"></span><span class="log"></span>';
    d.querySelector(".who").textContent = k.titel;
    d.querySelector(".tot").textContent = s;
    d.querySelector(".rest").textContent = s >= ZIEL ? "gewonnen" : "noch " + (ZIEL - s);
    d.querySelector(".log").textContent = posten(k.ids).join(" + ");
    tw.appendChild(d);
  });

  // Hinweis
  const hint = document.getElementById("hint");
  hint.textContent = bereit() ? "" : drei() ? "Die drei Spieler antippen." : "Spieler antippen: einmal Team grün, zweimal Team rot, dreimal raus.";
  hint.hidden = !hint.textContent;

  // Eingabe
  const n = st.neu;
  const ein = document.getElementById("eingabe");
  ein.hidden = !bereit();
  ein.classList.toggle("off", !!st.ende);
  const wer = document.getElementById("wer"); wer.innerHTML = "";
  spielend().forEach(id => wer.appendChild(knopf(marke(id), n.wer === id, () => waehle("wer", id), drei() ? "" : st.team[id])));
  const was = document.getElementById("was"); was.innerHTML = "";
  SPIELE.forEach(s => was.appendChild(knopf(s.n, n.typ === s.id, () => waehle("typ", s.id))));
  document.getElementById("punkteNormal").hidden = n.typ !== "normal";
  const za = document.getElementById("zahlen"); za.innerHTML = "";
  NORMAL.forEach(w => za.appendChild(knopf(w, n.wert === w, () => waehle("wert", w))));
  const sp = document.getElementById("spritz"); sp.innerHTML = "";
  SPRITZ.forEach(s => sp.appendChild(knopf(s.n + " ×" + s.f, n.f === s.f, () => waehle("f", s.f))));
  document.getElementById("summe").innerHTML = n.wer
    ? name(n.wer) + " spielt " + spielName(n.typ) + (n.f > 1 ? ", " + SPRITZ.find(s => s.f === n.f).n : "") + ": <b>" + (n.f > 1 ? n.wert + " × " + n.f + " = " : "") + n.wert * n.f + "</b>"
    : "Zuerst antippen, wer spielt.";
  document.getElementById("gew").disabled = document.getElementById("ver").disabled = !n.wer;

  // Ergebnis
  const res = document.getElementById("result");
  res.hidden = !st.ende;
  if (st.ende) {
    const bu = st.ende.bu, ids = Object.keys(bu);
    const schneider = ids.some(i => bu[i] === 2);
    const sieger = karten().filter(k => st.ende.sieger.includes(k.key)).flatMap(k => k.ids);
    document.getElementById("resTitle").textContent = (schneider ? "Schneider! " : "Bummerl! ") + namen(sieger) + (sieger.length > 1 ? " gewinnen" : " gewinnt");
    const eins = ids.filter(i => bu[i] === 1), zwei = ids.filter(i => bu[i] === 2);
    const teil = (l, z) => l.map(name).join(" und ") + (l.length > 1 ? " bekommen je " : " bekommt ") + z;
    document.getElementById("resText").textContent = karten().map(k => punkte(k.ids)).join(" : ") + ". " +
      [eins.length ? teil(eins, "1 Bummerl") : "", zwei.length ? teil(zwei, "2 Bummerl") : ""].filter(Boolean).join(", ") + ".";
  }

  // Bummerl-Stand
  document.getElementById("stand").innerHTML = SPIELER.map(p => {
    const c = st.bummerl[p.id] || 0;
    return '<div><div class="n">' + marke(p.id) + '</div><div class="c' + (c ? "" : " z") + '">' + c + "</div></div>";
  }).join("");

  // Verlauf
  const h = document.getElementById("hist");
  h.innerHTML = st.partien.length ? "" : '<div class="empty">Noch keine Partie fertig.</div>';
  st.partien.slice(0, 40).forEach(x => {
    const d = document.createElement("div");
    d.className = "row";
    const uhr = new Date(x.zeit).toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
    d.innerHTML = "<span></span><span class='m'></span>";
    d.firstChild.textContent = x.text || (namen(x.sieger) + " vor " + namen(x.verlierer) + (x.schneider ? " (Schneider)" : ""));
    d.lastChild.textContent = (x.stand || x.punkte.join(":")) + "  " + uhr;
    h.appendChild(d);
  });

  document.getElementById("undo").disabled = !undo.length;
  document.getElementById("abort").hidden = !laeuft();
}

// Statistik, getrennt für 3er und 4er
const pz = (a, b) => b ? Math.round(100 * a / b) + " %" : "–";
function zeigeStatistik() {
  const tabs = document.getElementById("statTabs"); tabs.innerHTML = "";
  [["4", "4er"], ["3", "3er"]].forEach(([m, t]) => tabs.appendChild(knopf(t, statModus === m, () => { statModus = m; zeigeStatistik(); })));
  const sp = st.spiele.filter(s => s.modus === statModus);
  const out = document.getElementById("statInhalt");
  if (!sp.length) { out.innerHTML = '<div class="sheet"><div class="empty" style="padding-top:14px">Noch keine Spiele beim ' + statModus + 'er eingetragen.</div></div>'; return; }

  const zeile = cells => "<tr>" + cells.map(c => "<td>" + c + "</td>").join("") + "</tr>";
  const gespritzt = sp.filter(s => s.f > 1).length;
  let html = '<div class="sheet"><div class="kopf"><b>' + sp.length + ' Spiele</b><span>davon ' + gespritzt + " gespritzt</span></div><div class='pad16'><table>" +
    "<tr><th>Spiel</th><th>Anzahl</th><th>Anteil</th><th>gewonnen</th></tr>";
  SPIELE.forEach(t => {
    const x = sp.filter(s => s.typ === t.id);
    if (x.length) html += zeile([t.n, x.length, pz(x.length, sp.length), pz(x.filter(s => s.gewonnen).length, x.length)]);
  });
  html += "</table></div></div>";

  // pro Spieler: wie oft dabei, wie oft etwas angesagt (alles außer Normal), was und mit welchem Erfolg
  SPIELER.forEach(p => {
    const dabei = sp.filter(s => s.spieler.includes(p.id));
    if (!dabei.length) return;
    const eigene = sp.filter(s => s.wer === p.id);
    const angesagt = eigene.filter(s => s.typ !== "normal");
    html += '<div class="sheet"><div class="kopf"><b>' + marke(p.id) + "</b><span>" + dabei.length + " Spiele dabei, sagt in " +
      pz(angesagt.length, dabei.length) + " etwas an</span></div>";
    if (eigene.length) {
      html += "<div class='pad16'><table><tr><th>spielt</th><th>mal</th><th>gewonnen</th><th>verloren</th></tr>";
      SPIELE.forEach(t => {
        const x = eigene.filter(s => s.typ === t.id);
        if (!x.length) return;
        const g = x.filter(s => s.gewonnen).length;
        html += zeile([t.n, x.length, "<span class='gw'>" + g + " · " + pz(g, x.length) + "</span>", "<span class='vl'>" + (x.length - g) + " · " + pz(x.length - g, x.length) + "</span>"]);
      });
      html += "</table></div>";
    }
    html += "</div>";
  });
  out.innerHTML = html;
}
function ansicht(stat) {
  document.getElementById("block").hidden = stat;
  document.getElementById("statistik").hidden = !stat;
  if (stat) { statModus = st.modus; zeigeStatistik(); }
  window.scrollTo(0, 0);
}

document.querySelectorAll(".modus button").forEach(b => b.onclick = () => {
  if (st.modus === b.dataset.m) return;
  if (laeuft() && !confirm("Laufende Partie abbrechen und wechseln?")) return;
  merk();
  st.modus = b.dataset.m;
  st.partie = []; st.ende = null; st.neu = { wer: null, typ: "normal", wert: 1, f: 1 };
  save(); zeige();
  if (!document.getElementById("statistik").hidden) { statModus = st.modus; zeigeStatistik(); }
});
document.getElementById("gew").onclick = () => abschliessen(true);
document.getElementById("ver").onclick = () => abschliessen(false);
document.getElementById("undo").onclick = () => {
  if (!undo.length) return;
  zurueck();
  save(); zeige(); toast("Rückgängig");
  if (!document.getElementById("statistik").hidden) zeigeStatistik();
};
document.getElementById("next").onclick = neuePartie;
document.getElementById("abort").onclick = () => { if (confirm("Laufende Partie ohne Bummerl beenden? Die Spiele bleiben in der Statistik.")) neuePartie(); };
document.getElementById("reset").onclick = () => {
  if (!confirm("Alle Bummerl auf 0 setzen? Verlauf und Statistik bleiben.")) return;
  merk();
  st.bummerl = leer().bummerl; st.partie = []; st.ende = null;
  save(); zeige();
};
document.getElementById("zurStat").onclick = () => ansicht(true);
document.getElementById("zumBlock").onclick = () => ansicht(false);
document.getElementById("statLoeschen").onclick = () => {
  if (!confirm("Alle gespeicherten Spiele löschen? Das lässt sich nicht rückgängig machen.")) return;
  st.spiele = []; undo = [];
  save(); zeige(); zeigeStatistik();
};

zeige();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
