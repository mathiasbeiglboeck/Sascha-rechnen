<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BetterNotes</title>
<style>
/* Web-Ansicht für Gäste: dieselben Seiten wie in der App, live, und mit der Maus mitzeichnen */
:root { --bg:#e6e6e1; --bar:#fbfaf6; --text:#23302a; --muted:#7b847e; --line:#dcd8cc; --accent:#2f6b4f;
  --glass:rgba(251,250,246,.84); --hover:rgba(35,48,42,.07); --sel:rgba(35,48,42,.12);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text); font-family:var(--f); }
/* Werkzeugleiste wie am iPad: schwebende Kapsel oben in der Mitte, die Seiten laufen darunter durch */
#bar { position:sticky; top:0; z-index:5; padding:6px 10px 4px; pointer-events:none; }
#tools { pointer-events:auto; width:fit-content; max-width:100%; margin:0 auto; display:flex; flex-wrap:wrap;
  align-items:center; justify-content:center; gap:2px 6px; padding:4px 10px; border-radius:21px;
  background:var(--glass); -webkit-backdrop-filter:blur(18px) saturate(1.6); backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:0 2px 10px rgba(0,0,0,.09), 0 0 0 .5px rgba(0,0,0,.08);
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
/* Der Titel gibt der sechsten Farbe ihren Platz (27 px): Die Leiste bricht nicht öfter um als mit fünf */
#title { font-size:13px; font-weight:600; max-width:163px; padding:0 4px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sep { flex:none; width:1px; height:18px; background:rgba(35,48,42,.15); }
#tools button { -webkit-appearance:none; appearance:none; margin:0; }
#colors, #widths { display:flex; align-items:center; gap:1px; }
.dot { width:26px; height:26px; padding:3px; border:0; border-radius:50%; background-clip:content-box; cursor:pointer; }
.w { width:22px; height:26px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.w span { background:var(--text); opacity:.3; border-radius:50%; display:block; }
.w.on span { opacity:.9; }
#tools button.icon { width:30px; height:28px; padding:0; border:0; border-radius:7px; background:none; color:var(--text);
  display:inline-grid; place-items:center; cursor:pointer; }
.icon svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
#tools .icon.on, #tools #follow.on { background-color:var(--sel); }
#follow { font:500 12.5px var(--f); height:26px; padding:0 9px; border:0; border-radius:13px; background:none; color:var(--muted); cursor:pointer; }
#follow.on { color:var(--text); }
@media (hover:hover) { #tools .icon:hover, #tools #follow:hover { background-color:var(--hover); }
  #tools .icon.on:hover, #tools #follow.on:hover { background-color:var(--sel); }
  .dot:hover { box-shadow:inset 0 0 0 1.5px rgba(35,48,42,.25); } }
.dot.on, .dot.on:hover { box-shadow:inset 0 0 0 1.5px rgba(35,48,42,.6); }
#status { font-size:12px; color:var(--muted); white-space:nowrap; display:inline-flex; align-items:center; gap:4px; padding-right:2px; }
#status::before { content:""; width:7px; height:7px; border-radius:50%; background:#c2c6c2; }
#status.live::before { background:#34c759; }
#status:empty::before { display:none; }
#status svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; margin-left:2px; }
.br { display:none; }
/* Schmaler (iPad mini, geteilter Bildschirm): enger, damit es in einer Zeile bleibt */
@media (max-width:820px) {
  #tools { gap:2px 4px; }
  #title { max-width:83px; }
  #tools button.icon { width:28px; }
}
/* Handy: oben Name und Status, darunter die Werkzeuge */
@media (max-width:700px) {
  #bar { padding:6px 6px 4px; }
  #tools { gap:2px 3px; padding:4px 8px; }
  .sep { display:none; }
  #title { order:-4; max-width:min(200px, 45vw); }
  #follow { order:-3; }
  #status { order:-2; }
  .br { display:block; order:-1; flex-basis:100%; height:0; }
  .dot { width:22px; height:22px; padding:2px; }
  .w { width:19px; }
  #tools button.icon { width:26px; }
}
/* Handy hochkant: noch enger, damit die sechs Farben, Dicken und Werkzeuge in einer Zeile bleiben (ab 360 breit,
   mit „Einfügen“ ab 390) */
@media (max-width:440px) {
  #tools { gap:2px; padding:4px 6px; }
  .dot { width:21px; height:21px; }
  .w { width:17px; }
}
#pages { max-width:1100px; margin:0 auto; padding:6px 0 40px; }
.page { position:relative; background:#fff; margin:0 auto 6px; }
.page canvas { position:absolute; inset:0; width:100%; height:100%; }
.page svg.ptr { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
.page svg.ptr path { fill:none; stroke-linecap:round; stroke-linejoin:round; }
body.pointing .page canvas.ink { cursor:crosshair; }
body { --ptr:#ff1f8f; }
/* Wie am iPad: das Zeigestift-Symbol in der eigenen Zeigefarbe */
#tools #pointer { color:var(--ptr); }
.page canvas.ink { touch-action:pan-y; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
/* Telefon (kein Pencil): wie in der App am iPhone zuerst „Nur sehen“, ein Finger scrollt, zwei zoomen. Nach „Bearbeiten“
   zeichnet ein Finger und scrollt nirgends (auch nicht auf Leiste, Lücken und Auswahl); zwei Finger zoomen (Browser) und
   scrollen (Browser oder Skript, siehe fingers). Ohne pinch-zoom im Browser gilt none, gescrollt wird dann vom Skript.
   iPad und Computer bleiben bei pan-y */
body.phone .page canvas.ink { touch-action:manipulation; }
body.phone.editing, body.phone.editing .page canvas.ink, body.phone.editing #sel { touch-action:none; touch-action:pinch-zoom; }
#tools #edit, #tools #view { display:none; }
body.phone #tools #edit { display:inline-flex; }
body.phone.editing #tools #edit { display:none; }
body.phone.editing #tools #view { display:inline-grid; }
body.phone:not(.editing) #colors, body.phone:not(.editing) #widths, body.phone:not(.editing) #pointer,
body.phone:not(.editing) #eraser, body.phone:not(.editing) #lasso, body.phone:not(.editing) #paste,
body.phone:not(.editing) #undo, body.phone:not(.editing) .sep, body.phone:not(.editing) .br { display:none; }
@media (max-width:700px) { #tools #edit, #tools #view { order:-1; } }
/* Telefon quer (ab 821 breit): Auch das Auge passt noch in die eine Zeile, der Titel gibt den Platz dafür her */
@media (min-width:821px) { body.phone.editing #title { max-width:127px; } }
#tools #edit { font:500 12.5px var(--f); height:26px; padding:0 9px 0 7px; border:0; border-radius:13px;
  background:var(--sel); color:var(--text); align-items:center; gap:4px; cursor:pointer; }
#edit svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
body.drawing .page canvas.ink { cursor:crosshair; }
body.erasing .page canvas.ink { cursor:none; }
#eraser-cursor { position:fixed; z-index:6; pointer-events:none; border:1.5px solid rgba(0,0,0,.55); border-radius:50%;
  background:rgba(255,255,255,.35); display:none; transform:translate(-50%,-50%); }
body.erasing #eraser-cursor.show { display:block; }
body.lassoing .page canvas.ink { cursor:crosshair; }
#lasso-svg { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; }
#lasso-svg path { fill:rgba(47,107,79,.08); stroke:#2f6b4f; stroke-width:1.5; stroke-dasharray:5 4; }
#sel { position:fixed; z-index:7; border:1.5px dashed #2f6b4f; background:rgba(47,107,79,.06); cursor:move; touch-action:none; display:none; }
#sel-bar { position:absolute; left:0; bottom:100%; margin-bottom:6px; display:flex; gap:4px; white-space:nowrap; }
#sel-bar button { font:13px var(--f); border:0; border-radius:7px; padding:5px 9px; background:var(--text); color:var(--bar); cursor:pointer; }
#tools #paste[hidden] { display:none; }
#tools #export[aria-disabled="true"] { opacity:.45; cursor:progress; }
/* Sichern geht, solange die Ansicht verbunden ist: Dann zeigt sie den neuesten Stand. Ohne Verbindung und nach dem
   Ende des Teilens ist die Leiste wie bisher */
#tools:has(#status:not(.live)) #export { display:none; }
/* Handy: „Als PDF sichern“ steht im Nur-Sehen-Modus oben bei Name und Status (beim Bearbeiten nicht, dort ist die
   Leiste voll). Damit „Bearbeiten“ daneben Platz hat, kürzt sich der Name etwas früher. Mit dem Auge für Gäste ist der
   Status zu lang dafür: Dann bekommt der Name seine alte Breite, „Bearbeiten“ rückt wie bisher darunter (ebenso ohne
   Verbindung, wenn der Knopf fehlt) */
body.phone.editing #tools #export { display:none; }
body.phone #tools #export { height:26px; }
@media (max-width:700px) {
  #tools #export { order:-2; }
  body.phone:not(.editing) #title { max-width:max(90px, min(200px, 45vw, calc(100vw - 260px))); }
}
@media (max-width:440px) {
  body.phone:not(.editing) #title { max-width:max(90px, min(200px, 45vw, calc(100vw - 252px))); }
}
@media (max-width:700px) {
  body.phone:not(.editing) #tools:has(#status svg) #title,
  body.phone:not(.editing) #tools:has(#status:not(.live)) #title { max-width:min(200px, 45vw); }
}
/* Breites Fenster: Mit „Einfügen“ oder dem Auge für Gäste wird die eine Zeile durch den neuen Knopf sonst gerade zu
   lang. Der Name gibt dann so viel Platz her wie nötig (etwas mehr, für andere Schriften), aber nur, wenn der Knopf
   da ist (verbunden; das Auge gibt es nur dann) */
@media (min-width:701px) and (max-width:820px) {
  body:not(.phone) #tools:has(#paste:not([hidden])):has(#status.live) #title,
  body:not(.phone) #tools:has(#status svg) #title { max-width:max(48px, min(83px, calc(100vw - 646px))); }
  body:not(.phone) #tools:has(#paste:not([hidden])):has(#status.live svg) #title { max-width:max(48px, min(83px, calc(100vw - 678px))); }
}
@media (min-width:821px) {
  body:not(.phone) #tools:has(#paste:not([hidden])):has(#status.live) #title { max-width:min(163px, calc(100vw - 685px)); }
  body:not(.phone) #tools:has(#status svg) #title { max-width:min(163px, calc(100vw - 681px)); }
  body:not(.phone) #tools:has(#paste:not([hidden])):has(#status.live svg) #title { max-width:min(163px, calc(100vw - 717px)); }
}
#msg { max-width:520px; margin:80px auto; text-align:center; color:var(--muted); line-height:1.5; padding:0 16px; }
#toast { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:8;
  width:max-content; max-width:calc(100% - 32px); box-sizing:border-box; padding:8px 14px; border-radius:16px;
  background:rgba(35,48,42,.9); color:var(--bar); font:13px/1.35 var(--f); text-align:center; pointer-events:none; }
#toast:empty { opacity:0; }
</style>
</head>
<body>
<div id="bar"><div id="tools">
  <span id="title">BetterNotes</span>
  <i class="sep"></i>
  <span id="colors"></span>
  <i class="sep"></i>
  <span id="widths"></span>
  <i class="sep"></i>
  <button id="pointer" class="icon" title="Zeigestift: leuchtet und verschwindet nach etwa zehn Sekunden (Taste P)" aria-label="Zeigestift">
    <svg viewBox="0 0 24 24"><path d="M3 16.5c1.6-3.2 3.6-8.5 6.1-8.5 1.7 0 1.3 2.7-.1 5.2-1.3 2.4-1.3 4.6.4 4.6 2.4 0 3.9-8.3 6.6-8.3 1.6 0 1.3 2.4.1 4.6-1 2-.8 3.6.7 3.6 1.5 0 2.6-1.6 3.2-2.8"/></svg>
  </button>
  <button id="eraser" class="icon" title="Radierer: löscht jeden Strich, den er berührt (Taste E)" aria-label="Radierer">
    <svg viewBox="0 0 24 24"><path d="M13.6 4.4a1.7 1.7 0 0 1 2.4 0l3.6 3.6a1.7 1.7 0 0 1 0 2.4L11.3 18.7H7.6l-3.2-3.2a1.7 1.7 0 0 1 0-2.4z"/><path d="M8.7 9.3l6 6M11.3 18.7h8.2"/></svg>
  </button>
  <button id="lasso" class="icon" title="Lasso: Striche umkreisen, dann verschieben, kopieren oder löschen (Taste L)" aria-label="Lasso">
    <svg viewBox="0 0 24 24"><ellipse cx="12.5" cy="9.5" rx="8" ry="5"/><path d="M7.4 13.3c-1.4 1.1-1.6 2.6-.4 3.4 1.4.9 1.6 2.4.6 3.8"/></svg>
  </button>
  <button id="paste" class="icon" hidden title="Kopierte Striche einfügen (Strg/Cmd+V)" aria-label="Einfügen">
    <svg viewBox="0 0 24 24"><path d="M15.5 5H17a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 17 20H7a1.5 1.5 0 0 1-1.5-1.5v-12A1.5 1.5 0 0 1 7 5h1.5"/><rect x="8.5" y="3.5" width="7" height="3" rx="1"/></svg>
  </button>
  <button id="undo" class="icon" title="Meinen letzten Schritt zurücknehmen (Strg/Cmd+Z)" aria-label="Zurück">
    <svg viewBox="0 0 24 24"><path d="M8.5 4.5L4 9l4.5 4.5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <i class="sep"></i>
  <button id="follow" class="on" title="Mitscrollen, wo gerade geschrieben wird">Folgen</button>
  <span id="status">verbinde …</span>
  <button id="export" class="icon" title="Als PDF sichern: alle Seiten mit den Notizen" aria-label="Als PDF sichern">
    <svg viewBox="0 0 24 24"><path d="M12 4.5v10M7.8 10.6l4.2 4.2 4.2-4.2"/><path d="M5 15v2.5A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5V15"/></svg>
  </button>
  <button id="edit" title="Mit dem Finger zeichnen; zwei Finger scrollen und zoomen">
    <svg viewBox="0 0 24 24"><path d="M4.5 19.5l1-4.2L15.8 5a1.9 1.9 0 0 1 2.7 0l.5.5a1.9 1.9 0 0 1 0 2.7L8.7 18.5z"/><path d="M14 6.8l3.2 3.2"/></svg>Bearbeiten
  </button>
  <button id="view" class="icon" title="Nur sehen: ein Finger scrollt" aria-label="Nur sehen">
    <svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <i class="br"></i>
</div></div>
<div id="pages"></div>
<div id="msg" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="eraser-cursor"></div>
<svg id="lasso-svg"><path d=""></path></svg>
<div id="sel"><div id="sel-bar">
  <button data-act="cut">Ausschneiden</button><button data-act="copy">Kopieren</button><button data-act="delete">Löschen</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";
const W = 768, GAP = 6, A4H = W * 297 / 210, GRID = W / 30;
const base = location.pathname.replace(/\/$/, "");
// Dieselben Farben in derselben Reihenfolge wie in der App: Schwarz, Grau, Blau, Rot, Grün, Orange. Blau bis Orange sind
// dort Display P3, hier dieselben Farben in sRGB, wie die App sie für ihre Striche sendet (auf drei Stellen gerundet)
const COLORS = [[0.1,0.1,0.11],[0.66,0.66,0.68],[0.021,0.275,0.56],[0.46,0.008,0],[0.012,0.398,0.322],[0.96,0.607,0.145]];
// PencilKit zeichnet dünne Striche am iPhone fast unsichtbar: unter etwa 3 Seitenpunkten werden sie blass
// Die beiden dünnsten wirken am iPhone (PencilKit, kleiner Maßstab) blass, am iPad und im Browser normal
const WIDTHS = [1.8, 2.5, 3.2, 4.2, 6.5];
const ERASER_PX = 8;      // Radius am Bildschirm, wie in der App: auch mit zwei Fingern gezoomt gleich groß
const zoom = () => window.visualViewport?.scale || 1;
let color = 3, width = 2, follow = true, erasing = false, lassoing = false, pointing = false; // Gäste beginnen mit Rot
// Telefon: Finger ist der Hauptzeiger, und der Bildschirm ist schmaler als jedes iPad (iPad mini: 744). Dort zeichnet wie in
// der App am iPhone nach „Bearbeiten“ der Finger (CanvasController: drawingPolicy .anyInput, Scrollen ab zwei Fingern)
const PHONE = matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 600;
let editing = false;      // nur am Telefon: false = „Nur sehen“
const fingerDraws = () => PHONE && editing;
document.body.classList.toggle("phone", PHONE);
let sel = null;    // Lasso-Auswahl {ids: Set, bbox}
let drag = null;   // {ids, dx, dy} während des Verschiebens
let clip = null;   // kopierte Striche (wire-Objekte)
let pasteShift = 0;
const selEl = document.getElementById("sel"), lassoPath = document.querySelector("#lasso-svg path");

let doc = null;           // {title, kind, pageCount}
let pdf = null;           // pdf.js-Dokument
let pageHeights = [];     // in Seitenpunkten
let frames = [];          // {y, h}
const strokes = new Map(); // id -> {data, wire, bbox}
let order = [];           // ids in Reihenfolge
const history = [];       // eigene Schritte: {added: [id], erased: [{id, data}]}
let ws = null, scale = 1;
let seen = 0;              // höchste Änderungsnummer, die hier schon angekommen ist
const els = [];           // je Seite {div, bg, ink, rendered}

// ---------- Werkzeugleiste ----------
const colorsEl = document.getElementById("colors"), widthsEl = document.getElementById("widths");
COLORS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "dot"; b.style.backgroundColor = `rgb(${c.map(v => v * 255).join(",")})`;
  b.onclick = () => { color = i; erasing = lassoing = pointing = false; tools(); };
  colorsEl.appendChild(b);
});
WIDTHS.forEach((w, i) => {
  const b = document.createElement("span");
  b.className = "w"; b.innerHTML = `<span style="width:${4 + i * 3}px;height:${4 + i * 3}px"></span>`;
  b.onclick = () => { width = i; erasing = lassoing = pointing = false; tools(); };
  widthsEl.appendChild(b);
});
function tools() {
  const pen = !erasing && !lassoing && !pointing;
  [...colorsEl.children].forEach((b, i) => b.classList.toggle("on", pen && i === color));
  [...widthsEl.children].forEach((b, i) => b.classList.toggle("on", i === width));
  document.getElementById("eraser").classList.toggle("on", erasing);
  document.getElementById("lasso").classList.toggle("on", lassoing);
  document.body.classList.toggle("erasing", erasing);
  document.body.classList.toggle("lassoing", lassoing);
  document.getElementById("pointer").classList.toggle("on", pointing);
  document.body.classList.toggle("pointing", pointing);
  document.body.classList.toggle("editing", editing);
  if (!lassoing) select(null);
}
document.getElementById("eraser").onclick = () => { erasing = !erasing; lassoing = pointing = false; tools(); };
document.getElementById("lasso").onclick = () => { lassoing = !lassoing; erasing = pointing = false; tools(); };
document.getElementById("pointer").onclick = () => { pointing = !pointing; erasing = lassoing = false; tools(); };
// „Bearbeiten“ und das Auge stehen an derselben Stelle: Wer gleich noch einmal tippt (Doppeltippen), schaltet nicht zurück
let switched = -Infinity;
function setEditing(on) {
  if (performance.now() - switched < 500) return;
  switched = performance.now();
  editing = on;
  if (!on) select(null); // Wie in der App: Im Nur-Sehen-Modus gibt es keine Auswahl, die sich verschieben ließe
  tools();
}
document.getElementById("edit").onclick = () => setEditing(true);
document.getElementById("view").onclick = () => setEditing(false);
addEventListener("keydown", (e) => {
  if (PHONE && !editing) return; // Nur sehen: auch mit Tastatur nichts ändern
  if (e.metaKey || e.ctrlKey || e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (k === "c" && sel) { e.preventDefault(); copySel(); }
    else if (k === "x" && sel) { e.preventDefault(); copySel(); deleteSel(); }
    else if (k === "v" && clip) { e.preventDefault(); paste(); }
    return;
  }
  if (e.key === "e" || e.key === "E") { erasing = !erasing; lassoing = pointing = false; tools(); }
  else if (e.key === "l" || e.key === "L") { lassoing = !lassoing; erasing = pointing = false; tools(); }
  else if (e.key === "p" || e.key === "P") { pointing = !pointing; erasing = lassoing = false; tools(); }
  else if ((e.key === "Backspace" || e.key === "Delete") && sel) { e.preventDefault(); deleteSel(); }
  else if (e.key === "Escape") select(null);
});
const cursorEl = document.getElementById("eraser-cursor");
addEventListener("pointermove", (e) => {
  if (!erasing || e.pointerType === "touch") return;
  const d = ERASER_PX * 2 / zoom();
  cursorEl.style.width = cursorEl.style.height = d + "px";
  cursorEl.style.left = e.clientX + "px"; cursorEl.style.top = e.clientY + "px";
  cursorEl.classList.toggle("show", !!e.target.closest?.(".page"));
});
tools();
document.getElementById("follow").onclick = (e) => {
  follow = !follow; e.target.classList.toggle("on", follow);
  if (!follow) followNext = null;
};
// Folgen: Die App meldet, was sie gerade zeigt. Solange hier gezeichnet wird (followBusy), wartet die Meldung und
// kommt gleich nach dem Absetzen (followLater). Beginnt ein Strich (Radieren, Lasso, Verschieben), hält das sanfte
// Mitscrollen an, falls es noch läuft; sein Ziel kommt dann ebenso nach dem Absetzen, wenn „Folgen“ noch an ist
let followAt = -Infinity, followLast = null, followNext = null;
const holdStill = () => {
  if (performance.now() - followAt >= 1500) return;
  scrollTo(scrollX, scrollY);
  if (follow) followNext = followNext || followLast;
};
function undo() {
  const step = history.pop();
  if (!step) return;
  const added = (step.added || []).filter(id => strokes.has(id));
  const erased = (step.erased || []).filter(s => !strokes.has(s.id));

// ---------- Zeigestift ----------
// Leuchtende Linien, nur live weitergereicht und nie gespeichert. Etwa zehn Sekunden nachdem jemand
// den Stift abgesetzt hat, verblassen alle seine Linien (zeigt er gleich weiter, bleiben sie so lange).
const SVGNS = "http://www.w3.org/2000/svg";
const CLIENT = Math.random().toString(36).slice(2, 10);

const PTR_COLOR = "#ff1f8f", PTR_W = 4.5, PTR_FADE = 10000;

try { const saved = localStorage.getItem(COLOR_KEY); if (isColor(saved)) myColor = saved; } catch {}

function setMyColor(c) {

  try { localStorage.setItem(COLOR_KEY, c); } catch {}
}

const ptrFade = new Map();  // from -> Timer
let pointerCount = 0;
function sendPointer(p, end) {

}

  for (const q of p.pts) { y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }
  const d = "M" + p.pts[0][0] + " " + p.pts[0][1] + " L" + p.pts.map(q => q[0] + " " + q[1]).join(" L");

// ---------- Verbindung ----------
// Eigene Striche und Löschungen, deren Echo vom Server noch fehlt. Reißt die Verbindung ab, gehen sie nach dem
// Wiederverbinden noch einmal hinaus, sobald der Server nachgeliefert hat, was er seit `seen` hat: Was er davon
// kennt, ist dann bestätigt, der Rest kam nie an (auch, was ohne Verbindung entstand).
const unconfirmed = new Map(); // id -> {type: "add", stroke} oder {type: "remove", id}, in der Reihenfolge der Schritte

function connect() {

  if (isColor(wanted)) q.set("c", wanted.slice(1));
  // Was seit der Momentaufnahme dazukam, schickt der Server gleich mit (sonst fehlte, was zwischen Laden
  // und Verbinden geschrieben wurde), ebenso einen Hinweis, falls sich inzwischen die Seiten geändert haben
  if (doc) { q.set("since", seen); q.set("pv", doc.pagesVersion || 0); q.set("dv", doc.pdfVersion || 0); }
  const query = q.toString() ? "?" + q : "";

  caughtUp = false;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + base + "/ws" + query);
  ws.onopen = () => status("live", true);
  ws.onclose = (e) => {
    if (e.code === 4001) { gone = true; return fail("Das Teilen wurde beendet."); }
    if (gone) return;
    status("Verbindung unterbrochen …");
    retryLater();
  };
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }

      if (buffer) buffer.push(...(msg.changes || []));

    } else if (msg.type === "you") {

      retries = 0; httpOk = false;

      if (followBusy()) followNext = msg;

    } else if (msg.type === "pages") {

      // Der Server schickt den Hinweis dann wieder, und bis dahin geht nichts Eigenes auf die neue Seitenordnung.
      // (Nicht auf onclose warten: Schließt der Browser selbst, meldet sich das erst nach Sekunden.) Die Pause
      // wächst hier eigens, denn das Verbinden selbst klappt ja: Ein dauernd scheiterndes Laden (etwa ein PDF, das
      // nicht kommt) soll nicht alle drei Sekunden alle Striche vom Server holen.
      const sock = ws;

function applyChanges(list) {
  let y0 = Infinity, y1 = -Infinity;
  const grow = (b) => { y0 = Math.min(y0, b.y0); y1 = Math.max(y1, b.y1); };
  // Entfernte Striche erst am Ende auf einmal austragen und neu zeichnen: Nach einer Seitenänderung kommen Tausende,
  // einzeln (jedes Mal die ganze Seite neu) hielt das den Browser viele Sekunden lang an
  const dropped = new Set();
  for (const c of list) {
    if (c.seq > seen) seen = c.seq;
    confirmed(c.id, c.data);

    if (c.data) {
      if (old) continue;
      // Hier eben erst entfernt und gleich wieder da (Rückgängig): den alten Platz in der Reihenfolge freigeben
      if (dropped.delete(c.id)) order = order.filter(o => o !== c.id);
      const r = addStroke(c.id, c.data); if (r) grow(r);
    } else if (old) {
      strokes.delete(c.id); dropped.add(c.id); grow(old.bbox);

      for (const id of dropped) sel.ids.delete(id);
      select(sel.ids.size ? sel.ids : null);
    }

// Neu laden, immer nur eines nach dem anderen (sonst kämen Seiten doppelt); kommt währenddessen noch
// ein Anlass, folgt genau ein weiteres Laden
let loading = null, loadAgain = false, buffer = null, gone = false;

// Tageslimits), mit wachsender Pause bis 30 s, damit nicht jeder Browser alle drei Sekunden anklopft. Kommt nur der
// WebSocket nicht durch, Abfragen aber schon, bleibt es bei 5 s. Kommt das Netz zurück oder wird die Seite wieder
// sichtbar, sofort, ohne die Pause abzuwarten.

  })();

}

// Grabsteinen und kostete am Server viel vom Tageslimit des Gratis-Tarifs. Ganz geladen wird nur, solange noch nichts da ist.
async function reconnect() {
  if (gone) return;

    try { await reload(); } catch { if (!gone) retryLater(); return; }
  } else if (retries >= 2) {

    // WebSocket durch). Nur bei sichtbarer Seite, eine Abfrage kostet am Server so viel wie ein Verbinden.
    httpOk = !document.hidden && await poll().then(() => true, () => false);

}
// Dasselbe Nachholen wie beim Verbinden, per Abfrage
async function poll() {
  const q = new URLSearchParams({ since: seen, pv: doc.pagesVersion || 0, dv: doc.pdfVersion || 0 });
  const res = await fetch(base + "/changes?" + q, { cache: "no-store" });
  if (res.status === 404) { gone = true; fail("Das Teilen wurde beendet."); throw new Error("ungültig"); }
  if (!res.ok) throw new Error("Server antwortet nicht");
  const msg = await res.json();
  if (msg.pages) return reload();
  if (buffer) buffer.push(...msg.changes); else applyChanges(msg.changes);
}

async function load(isReload) {
  buffer = [];

    // Sonst (etwa Tageslimit des Servers erreicht): später noch einmal
    if (!res.ok) throw new Error("Server antwortet nicht");
    const data = await res.json();
    // Ein neues PDF (Seiten gelöscht oder eingefügt) erst ganz laden, dann umschalten
    let heights = null;

      heights = [];

        const vp = (await nextPdf.getPage(i)).getViewport({ scale: 1 });
        heights.push(W * vp.height / vp.width);
      }
    }
    // Ab hier ohne Unterbrechung umstellen
    // Andere Seitenordnung: Eigene alte Schritte würden Striche an ihren alten Stellen zurückbringen
    if (isReload && doc && ((data.pagesVersion || 0) !== (doc.pagesVersion || 0) || (data.pdfVersion || 0) !== (doc.pdfVersion || 0))) {
      history.length = 0;

    }

    a.set(PDFName.of("F"), PDFNumber.of(flags | 2));
  }
  return ops;
}
/// Das Original mit den Notizen darüber. Wirft, wenn das so nicht sicher geht (dann als Bild)
async function overlayPDF(lib, snap, step) {
  const { PDFName, PDFRef, PDFArray } = lib;
  const out = await lib.PDFDocument.load(await same(snap.source, snap.data), { updateMetadata: false, parseSpeed: Infinity });
  const pages = out.getPages();
  if (pages.length !== snap.frames.length) throw new Error("andere Seitenzahl");
  if (new Set(pages.map((p) => p.node)).size !== pages.length) throw new Error("Seite doppelt");
  // Jede Seite muss so aussehen wie in pdf.js (pdf-lib liest bei doppelt vorhandenen Objekten manchmal ein anderes)
  const views = [];
  for (let i = 0; i < pages.length; i++) {
    if (pdf !== snap.source) throw CHANGED;
    const shown = await same(snap.source, snap.source.getPage(i + 1)), own = viewOf(pages[i]);
    if (own.rotate !== shown.rotate || own.view.some((v, j) => Math.abs(v - shown.view[j]) > 1e-3)) throw new Error("andere Seite");
    views.push(pageMatrix(own, snap.frames[i]));
  }
  if (views.some((m) => !m)) throw new Error("andere Seitengröße");
  const states = new Map();
  for (let i = 0; i < pages.length; i++) {
    const page = pages[i], f = snap.frames[i], m = views[i], wires = onPage(snap, f);
    if (wires.length) {
      const fix = balance(lib, out, page);
      if (fix.under) throw new Error("Inhalt unausgeglichen");
      // Teilen sich Seiten eine Liste von Inhalten, bekäme jede auch die Notizen der anderen
      const contents = page.node.get(PDFName.of("Contents"));
      if (contents instanceof PDFRef) {
        const list = out.context.lookup(contents);
        if (list instanceof PDFArray) page.node.set(PDFName.of("Contents"), out.context.obj(list.asArray()));
      }
      // Fläche jedes Strichs im PDF (für die Anmerkungen darunter)
      const boxes = wires.map((s) => {
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (const [x, y] of [[s.x0, s.y0 - f.y], [s.x1, s.y0 - f.y], [s.x0, s.y1 - f.y], [s.x1, s.y1 - f.y]]) {
          const px = m[0] * x + m[2] * y + m[4], py = m[1] * x + m[3] * y + m[5];
          x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py);
        }
        return [x0, y0, x1, y1];
      });
      const gs = stateNames(out, page, states);
      const before = flattenAnnots(lib, out, page, boxes);
      page.node.normalize();
      // Offene q und ein offener Text schließen, bevor pdf-lib den alten Inhalt mit Q beendet
      if (fix.open || fix.text) {
        const list = page.node.Contents();
        list.insert(list.size() - 1, await contentRef(out, (fix.text ? "ET\n" : "") + "Q\n".repeat(fix.open)));
      }
      await addInk(out, page, m, f, wires, { gs, before });
    }
    await step(i + 1);
  }
  return out;
}
/// Ersatz: jede Seite aus pdf.js als JPEG, die Notizen als Vektoren darüber. Bildpunkte je Seite nach Seitenzahl:
/// kurze Dokumente scharf (A4 wie doppelt gezeigt), lange Dokumente nicht riesig
async function rasterPDF(lib, snap, step) {
  const source = snap.source;
  if (source.numPages !== snap.frames.length) throw new Error("andere Seitenzahl");
  const out = await lib.PDFDocument.create(), states = new Map();
  const budget = Math.min(2.4e6, Math.max(0.8e6, 1.5e8 / snap.frames.length));
  for (let i = 0; i < snap.frames.length; i++) {
    if (pdf !== source) throw CHANGED;
    const page = await same(source, source.getPage(i + 1));
    const vp1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(2, Math.sqrt(budget / (vp1.width * vp1.height))) });
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (pdf !== source) throw CHANGED;
    try { await same(source, page.render({ canvasContext: ctx, viewport: vp }).promise); } finally { page.cleanup(); }
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.8));
    canvas.width = canvas.height = 0;
    if (!blob) throw new Error("Bild nicht erstellt");
    const image = await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
    const p = out.addPage([vp1.width, vp1.height]);
    p.drawImage(image, { x: 0, y: 0, width: vp1.width, height: vp1.height });
    const k = vp1.width / W, f = snap.frames[i];
    await addInk(out, p, [k, 0, 0, -k, 0, vp1.height], f, onPage(snap, f), { gs: stateNames(out, p, states) });
    await step(i + 1);
  }
  return out;
}
function saveFile(bytes, name) {
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
/// Dateiname wie beim Export in der App (CanvasController.fileName), Zeichen für Zeichen wie Swift (zusammengesetzte
/// Zeichen und Emoji als eines): „/ \ |“ werden „-“, „:“ wird „.“, „* ? " < >“ fallen weg, Steuerzeichen werden
/// Leerzeichen, keine Punkte und Leerzeichen an den Enden, höchstens 200 Bytes
function fileName(title) {
  const text = String(title || "");
  const chars = typeof Intl === "object" && Intl.Segmenter
    ? Array.from(new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(text), (s) => s.segment) : [...text];
  let name = "";
  for (const ch of chars) {
    if (ch === "/" || ch === "\\" || ch === "|") name += "-";
    else if (ch === ":") name += ".";
    else if (!['*', '?', '"', '<', '>'].includes(ch)) {
      const control = [...ch].some((u) => { const v = u.codePointAt(0); return v < 0x20 || (v >= 0x7f && v <= 0x9f); });
      name += control ? " " : ch;
    }
  }
  // Leerzeichen und Zeilenwechsel wie Swifts whitespacesAndNewlines, dazu Punkte
  const trim = (s) => s.replace(/^[\p{Z}\t-\r\u0085.]+|[\p{Z}\t-\r\u0085.]+$/gu, "");
  const kept = typeof Intl === "object" && Intl.Segmenter
    ? Array.from(new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(trim(name)), (s) => s.segment) : [...trim(name)];
  let short = "", bytes = 0;
  const utf8 = new TextEncoder();
  for (const ch of kept) {
    bytes += utf8.encode(ch).length;
    if (bytes > 200) break;
    short += ch;
  }
  return trim(short) || "Notizen";
}
// Warum es nichts mehr zu sichern gibt (wie es die Ansicht selbst sagt)
const goneText = () => document.getElementById("msg").textContent || "Das Teilen wurde beendet.";
async function exportPDF(e) {
  // Zweiter Klick eines Doppelklicks: nicht gleich noch einmal sichern
  if (exporting || e?.detail > 1) return;
  if (gone) return toast(goneText(), 3000);
  if (!doc || !frames.length || (doc.kind === "pdf" && !pdf)) return toast("Das Dokument lädt noch …", 2500);
  // aria-disabled statt disabled: Mit der Tastatur bleibt der Fokus so auf dem Knopf
  exporting = true; exportBtn.setAttribute("aria-disabled", "true");
  // Der Stand beim Tippen: Was danach live dazukommt, ist im PDF nicht mehr dabei. Die Bytes des PDFs gleich holen,
  // bevor die Ansicht es (neues PDF vom iPad) austauschen kann
  const wires = [];
  for (const id of order) {
    const s = strokes.get(id), b = s && inkBounds(s.wire);
    if (b) wires.push({ wire: s.wire, ...b });
  }
  const snap = { frames: frames.map((f) => ({ y: f.y, h: f.h })), wires, kind: doc.kind, source: pdf, title: doc.title || "" };
  if (snap.kind === "pdf") { snap.data = pdf.getData(); snap.data.catch(() => {}); }
  else {
    // Die leeren Seiten am Ende (im Notizbuch kommt nach der letzten beschriebenen immer eine) gehören nicht ins PDF
    let last = 0;
    snap.frames.forEach((f, i) => { if (onPage(snap, f).length) last = i; });
    snap.frames.length = last + 1;
  }
  const n = snap.frames.length;
  let raster = false;
  const step = (i) => {
    toast(raster ? `PDF wird erstellt (Seiten als Bilder) … ${i} von ${n}` : `PDF wird erstellt … ${i} von ${n} Seiten`);
    return breathe();
  };
  try {
    toast("PDF wird erstellt …");
    const lib = await loadPdfLib();
    let bytes = null;
    if (snap.kind === "pdf") {
      try {
        const out = await overlayPDF(lib, snap, step);
        toast("PDF wird gespeichert …");
        // Ohne neuen Titel: Der Name der Datei trägt ihn, die Angaben des Originals bleiben, wie sie sind
        bytes = await out.save({ objectsPerTick: Infinity });
      } catch (err) {
        if (err === CHANGED || pdf !== snap.source) throw CHANGED;
        raster = true;
      }
    }
    if (!bytes) {
      const out = raster ? await rasterPDF(lib, snap, step) : await notebookPDF(lib, snap, step);
      if (snap.title) try { out.setTitle(snap.title, { showInWindowTitleBar: true }); } catch {}
      toast("PDF wird gespeichert …");
      bytes = await out.save({ objectsPerTick: Infinity });
    }

    if (gone) return toast(goneText(), 3000);
    saveFile(bytes, fileName(snap.title) + ".pdf");
    toast("PDF gesichert", 2500);
  } catch (err) {
    // Neues PDF während des Sicherns: pdf.js bricht dann auch mit eigenen Fehlern ab
    toast(err === CHANGED || (snap.kind === "pdf" && pdf !== snap.source) ? "Das Dokument hat sich gerade geändert. Bitte noch einmal sichern."
      : err?.message === "pdf-lib fehlt" ? "PDF-Export geht gerade nicht: Ein Baustein dafür lädt nicht (Internet?)"
      : "PDF-Export hat nicht geklappt", 6000);
  } finally {
    exporting = false; exportBtn.removeAttribute("aria-disabled");
  }
}
exportBtn.onclick = exportPDF;
// Gleich nach dem Wechsel zwischen „Bearbeiten“ und „Nur sehen“ ordnet sich die Leiste neu: Ein zweites Tippen (Doppel-
// tippen) träfe dann einen anderen Knopf (Sichern, Zurück …). Solche Klicks fallen weg, wie setEditing es für sich tut
document.getElementById("tools").addEventListener("click", (e) => {
  if (performance.now() - switched < 500 && !e.target.closest("#edit, #view")) { e.stopPropagation(); e.preventDefault(); }
}, true);

let resizeTimer;
// Safari am iPad meldet „resize“ auch, wenn nur die Leisten einklappen: dann nichts neu anlegen
let lastWidth = 0;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = document.getElementById("pages").clientWidth;
    if (w !== lastWidth) { lastWidth = w; buildPages(); }
  }, 200);
});
load(false).then(connect).catch(() => { if (!gone) { status("Server antwortet nicht …"); retryLater(); } });
