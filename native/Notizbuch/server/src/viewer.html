<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>BetterNotes</title>
<style>
/* Web-Ansicht für Gäste: dieselben Seiten wie in der App, live, und mit der Maus mitzeichnen */
:root { --bg:#e6e6e1; --bar:#fbfaf6; --text:#23302a; --muted:#7b847e; --line:#dcd8cc; --chip:#ece7da; --accent:#2f6b4f;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif; }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--text); font-family:var(--f); }
#bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:8px 14px; background:var(--bar); border-bottom:1px solid var(--line); }
#title { font-weight:600; margin-right:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:40vw; }
#bar button { font:inherit; font-size:14px; border:0; border-radius:8px; padding:6px 10px; background:var(--chip); color:var(--text); cursor:pointer; }
#bar button.on { background:var(--text); color:var(--bar); }
.dot { width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
.dot.on { border-color:var(--text); }
.w { width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; border-radius:6px; }
.w span { background:var(--muted); border-radius:50%; display:block; }
.w.on span { background:var(--text); }
#status { font-size:13px; color:var(--muted); }
#pages { max-width:1100px; margin:0 auto; padding:6px 0 40px; }
.page { position:relative; background:#fff; margin:0 auto 6px; }
.page canvas { position:absolute; inset:0; width:100%; height:100%; }
.page canvas.ink { touch-action:pan-y; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
body.drawing .page canvas.ink { cursor:crosshair; }
body.erasing .page canvas.ink { cursor:none; }
#eraser-cursor { position:fixed; z-index:6; pointer-events:none; border:1.5px solid rgba(0,0,0,.55); border-radius:50%;
  background:rgba(255,255,255,.35); display:none; transform:translate(-50%,-50%); }
body.erasing #eraser-cursor.show { display:block; }
body.lassoing .page canvas.ink { cursor:crosshair; }
#lasso-svg { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:6; }
#lasso-svg path { fill:rgba(47,107,79,.08); stroke:#2f6b4f; stroke-width:1.5; stroke-dasharray:5 4; }
#sel { position:fixed; z-index:7; border:1.5px dashed #2f6b4f; background:rgba(47,107,79,.06); cursor:move; touch-action:none; display:none; }
#sel-bar { position:absolute; left:0; bottom:100%; margin-bottom:6px; display:flex; gap:4px; white-space:nowrap; }
#sel-bar button { font:13px var(--f); border:0; border-radius:7px; padding:5px 9px; background:var(--text); color:var(--bar); cursor:pointer; }
#paste[hidden] { display:none; }
#msg { max-width:520px; margin:80px auto; text-align:center; color:var(--muted); line-height:1.5; padding:0 16px; }
</style>
</head>
<body>
<div id="bar">
  <span id="title">BetterNotes</span>
  <span id="colors"></span>
  <span id="widths"></span>
  <button id="eraser" title="Radierer: löscht jeden Strich, den er berührt (Taste E)">Radierer</button>
  <button id="lasso" title="Lasso: Striche umkreisen, dann verschieben, kopieren oder löschen (Taste L)">Lasso</button>
  <button id="paste" hidden title="Kopierte Striche einfügen (Strg/Cmd+V)">Einfügen</button>
  <button id="undo" title="Meinen letzten Schritt zurücknehmen">↶</button>
  <button id="follow" class="on" title="Mitscrollen, wo gerade geschrieben wird">Folgen</button>
  <span id="status">verbinde …</span>
</div>
<div id="pages"></div>
<div id="msg" hidden></div>
<div id="eraser-cursor"></div>
<svg id="lasso-svg"><path d=""></path></svg>
<div id="sel"><div id="sel-bar">
  <button data-act="cut">Ausschneiden</button><button data-act="copy">Kopieren</button><button data-act="delete">Löschen</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";
const W = 768, GAP = 6, A4H = W * 297 / 210, GRID = W / 30;
const base = location.pathname.replace(/\/$/, "");
const COLORS = [[0.8,0.17,0.15],[0.12,0.27,0.64],[0.13,0.52,0.29],[0.1,0.1,0.11]];
// PencilKit zeichnet dünne Striche am iPhone fast unsichtbar: unter etwa 3 Seitenpunkten werden sie blass
// Die beiden dünnsten wirken am iPhone (PencilKit, kleiner Maßstab) blass, am iPad und im Browser normal
const WIDTHS = [1.8, 2.5, 3.2, 4.2, 6.5];
const ERASER_PX = 8;      // Radius am Bildschirm, wie in der App
let color = 0, width = 2, follow = true, erasing = false, lassoing = false;
let sel = null;    // Lasso-Auswahl {ids: Set, bbox}
let drag = null;   // {ids, dx, dy} während des Verschiebens
let clip = null;   // kopierte Striche (wire-Objekte)
let pasteShift = 0;
const selEl = document.getElementById("sel"), lassoPath = document.querySelector("#lasso-svg path");

let doc = null;           // {title, kind, pageCount}
let pdf = null;           // pdf.js-Dokument
let pageHeights = [];     // in Seitenpunkten
let frames = [];          // {y, h}
const strokes = new Map(); // id -> {data, wire, bbox}
let order = [];           // ids in Reihenfolge
const history = [];       // eigene Schritte: {added: [id], erased: [{id, data}]}
let ws = null, scale = 1;
const els = [];           // je Seite {div, bg, ink, rendered}

// ---------- Werkzeugleiste ----------
const colorsEl = document.getElementById("colors"), widthsEl = document.getElementById("widths");
COLORS.forEach((c, i) => {
  const b = document.createElement("button");
  b.className = "dot"; b.style.background = `rgb(${c.map(v => v * 255).join(",")})`;
  b.onclick = () => { color = i; erasing = lassoing = false; tools(); };
  colorsEl.appendChild(b);
});
WIDTHS.forEach((w, i) => {
  const b = document.createElement("span");
  b.className = "w"; b.innerHTML = `<span style="width:${3 + i * 3}px;height:${3 + i * 3}px"></span>`;
  b.onclick = () => { width = i; erasing = lassoing = false; tools(); };
  widthsEl.appendChild(b);
});
function tools() {
  const pen = !erasing && !lassoing;
  [...colorsEl.children].forEach((b, i) => b.classList.toggle("on", pen && i === color));
  [...widthsEl.children].forEach((b, i) => b.classList.toggle("on", pen && i === width));
  document.getElementById("eraser").classList.toggle("on", erasing);
  document.getElementById("lasso").classList.toggle("on", lassoing);
  document.body.classList.toggle("erasing", erasing);
  document.body.classList.toggle("lassoing", lassoing);
  if (!lassoing) select(null);
}
document.getElementById("eraser").onclick = () => { erasing = !erasing; lassoing = false; tools(); };
document.getElementById("lasso").onclick = () => { lassoing = !lassoing; erasing = false; tools(); };
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (k === "c" && sel) { e.preventDefault(); copySel(); }
    else if (k === "x" && sel) { e.preventDefault(); copySel(); deleteSel(); }
    else if (k === "v" && clip) { e.preventDefault(); paste(); }
    return;
  }
  if (e.key === "e" || e.key === "E") { erasing = !erasing; lassoing = false; tools(); }
  else if (e.key === "l" || e.key === "L") { lassoing = !lassoing; erasing = false; tools(); }
  else if ((e.key === "Backspace" || e.key === "Delete") && sel) { e.preventDefault(); deleteSel(); }
  else if (e.key === "Escape") select(null);
});
const cursorEl = document.getElementById("eraser-cursor");
addEventListener("pointermove", (e) => {
  if (!erasing || e.pointerType === "touch") return;
  const d = ERASER_PX * 2;
  cursorEl.style.width = cursorEl.style.height = d + "px";
  cursorEl.style.left = e.clientX + "px"; cursorEl.style.top = e.clientY + "px";
  cursorEl.classList.toggle("show", !!e.target.closest?.(".page"));
});
tools();
document.getElementById("follow").onclick = (e) => { follow = !follow; e.target.classList.toggle("on", follow); };
function undo() {
  const step = history.pop();
  if (!step) return;
  const added = (step.added || []).filter(id => strokes.has(id));
  const erased = (step.erased || []).filter(s => !strokes.has(s.id));
  if (!added.length && !erased.length) return undo(); // schon von jemand anderem geändert
  select(null);
  for (const id of added) { removeStroke(id); send({ type: "remove", id }); }
  for (const s of erased) {
    const r = addStroke(s.id, s.data);
    if (r) redrawRange(r.y0, r.y1);
    send({ type: "add", stroke: s });
  }
}
document.getElementById("undo").onclick = undo;
const status = (t) => (document.getElementById("status").textContent = t);
function fail(text) {
  document.getElementById("pages").hidden = true;
  const m = document.getElementById("msg"); m.hidden = false; m.textContent = text;
  status("");
}

// ---------- Striche: gleiches Format und gleiche IDs wie in der App ----------
function swiftNumber(v) {
  if (Object.is(v, -0)) return "-0.0";
  return Number.isInteger(v) ? v.toFixed(1) : String(v);
}
async function strokeID(wire) {
  // Nur die ersten neun Werte je Punkt, wie in der App (der zehnte, die Zweitskala, zählt nicht zur ID)
  const geometry = JSON.stringify([wire.ink, ...wire.p.map(p => p.slice(0, 9).map(swiftNumber).join(","))]);
  const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(geometry)));
  return [...hash.slice(0, 12)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function addStroke(id, data) {
  let wire;
  try { wire = JSON.parse(data); } catch { return; }
  if (!wire.p || !wire.p.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of wire.p) { x0 = Math.min(x0, p[0] - p[3]); x1 = Math.max(x1, p[0] + p[3]); y0 = Math.min(y0, p[1] - p[3]); y1 = Math.max(y1, p[1] + p[3]); }
  if (!strokes.has(id)) order.push(id);
  strokes.set(id, { wire, data, bbox: { x0, y0, x1, y1 } });
  return { y0, y1 };
}
function removeStroke(id) {
  const s = strokes.get(id);
  if (!s) return;
  strokes.delete(id);
  order = order.filter(o => o !== id);
  redrawRange(s.bbox.y0, s.bbox.y1);
  if (sel && sel.ids.has(id)) { sel.ids.delete(id); select(sel.ids.size ? sel.ids : null); }
}

// ---------- Seiten ----------
function layout() {
  frames = []; let y = GAP;
  for (const h of pageHeights) { frames.push({ y, h }); y += h + GAP; }
}
function notebookPagesNeeded() {
  let maxY = 0; for (const s of strokes.values()) maxY = Math.max(maxY, s.bbox.y1);
  let n = Math.max(doc.pageCount || 1, 1);
  while (GAP + (n - 1) * (A4H + GAP) < maxY - 2) n++;
  return n;
}
function buildPages() {
  const holder = document.getElementById("pages");
  lastWidth = holder.clientWidth;
  scale = Math.min(holder.clientWidth || innerWidth, 1100) / W;
  while (els.length < frames.length) {
    const div = document.createElement("div"); div.className = "page";
    const bg = document.createElement("canvas"), ink = document.createElement("canvas"); ink.className = "ink";
    for (const c of [bg, ink]) { c.width = 0; c.height = 0; }
    div.append(bg, ink); holder.appendChild(div);
    const el = { div, bg, ink, rendered: 0, live: false, index: els.length };
    els.push(el); attachDrawing(el); observer.observe(div);
  }
  els.forEach((el, i) => {
    const f = frames[i];
    el.div.style.width = W * scale + "px"; el.div.style.height = f.h * scale + "px";
    if (el.live) { el.live = false; wake(el); }
  });
  els.forEach((el) => { if (isVisible(el.div)) wake(el); });
  placeSel();
}
function isVisible(div) { const r = div.getBoundingClientRect(); return r.bottom > -800 && r.top < innerHeight + 800; }

// Nur Seiten in Sichtweite bekommen Bildspeicher. Sonst geht Safari am iPad
// bei vielen Seiten der Speicher aus („Diese Seite kann nicht geöffnet werden“).
function pixelRatio() { return Math.min(devicePixelRatio || 1, 2); }
function wake(el) {
  if (!el || el.live) return;
  const f = frames[el.index], r = pixelRatio();
  el.task?.cancel();
  for (const c of [el.bg, el.ink]) { c.width = Math.round(W * scale * r); c.height = Math.round(f.h * scale * r); }
  el.live = true; el.rendered = 0;
  renderBackground(el);
  drawInk(el.index);
}
function sleep(el) {
  if (!el || !el.live) return;
  el.task?.cancel();
  for (const c of [el.bg, el.ink]) { c.width = 0; c.height = 0; }
  el.live = false; el.rendered = 0;
}
const observer = new IntersectionObserver((entries) => {
  for (const e of entries) {
    const el = els.find(x => x.div === e.target);
    if (e.isIntersecting) wake(el); else sleep(el);
  }
}, { rootMargin: "800px 0px" });

async function renderBackground(el) {
  if (!el || !el.live || el.rendered) return;
  el.rendered = 1;
  const ctx = el.bg.getContext("2d"), s = el.bg.width / W;
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, el.bg.width, el.bg.height);
  if (pdf) {
    const page = await pdf.getPage(el.index + 1);
    const vp = page.getViewport({ scale: el.bg.width / page.getViewport({ scale: 1 }).width });
    if (!el.live) return;
    const task = page.render({ canvasContext: ctx, viewport: vp });
    el.task = task;
    try { await task.promise; } catch {} // abgebrochen, weil die Seite aus dem Blick ist
    if (el.task === task) el.task = null;
    page.cleanup(); // pdf.js hält sonst Daten jeder je gezeigten Seite
  } else {
    ctx.strokeStyle = "#d1d1d1"; ctx.lineWidth = Math.max(1, 0.5 * s);
    ctx.beginPath();
    for (let x = GRID; x < W; x += GRID) { ctx.moveTo(x * s, 0); ctx.lineTo(x * s, el.bg.height); }
    for (let y = GRID; y < frames[el.index].h; y += GRID) { ctx.moveTo(0, y * s); ctx.lineTo(el.bg.width, y * s); }
    ctx.stroke();
  }
}

function drawWire(ctx, wire, s, offY) {
  const c = wire.c || [0, 0, 0, 1], p = wire.p;
  ctx.strokeStyle = ctx.fillStyle = `rgba(${c[0] * 255},${c[1] * 255},${c[2] * 255},${c[3] ?? 1})`;
  ctx.lineCap = ctx.lineJoin = "round";
  if (p.length === 1) { ctx.beginPath(); ctx.arc(p[0][0] * s, (p[0][1] - offY) * s, Math.max(p[0][3] * s / 2, 0.5), 0, 7); ctx.fill(); return; }
  // Glatte Kurve durch die Mittelpunkte der Kontrollpunkte, Breite je Abschnitt
  for (let i = 1; i < p.length; i++) {
    const a = p[i - 1], b = p[i];
    const m0 = i === 1 ? a : [(p[i - 2][0] + a[0]) / 2, (p[i - 2][1] + a[1]) / 2];
    const m1 = i === p.length - 1 ? b : [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    ctx.lineWidth = Math.max(((a[3] + b[3]) / 2) * s, 0.6);
    ctx.beginPath();
    ctx.moveTo(m0[0] * s, (m0[1] - offY) * s);
    ctx.quadraticCurveTo(a[0] * s, (a[1] - offY) * s, m1[0] * s, (m1[1] - offY) * s);
    ctx.stroke();
  }
}
function drawInk(i) {
  const el = els[i], f = frames[i];
  if (!el || !el.live) return;
  const ctx = el.ink.getContext("2d"), s = el.ink.width / W;
  ctx.clearRect(0, 0, el.ink.width, el.ink.height);
  for (const id of order) {
    const st = strokes.get(id);
    // Beim Verschieben mit dem Lasso werden die ausgewählten Striche versetzt gezeichnet
    const d = drag && drag.ids.has(id) ? drag : null;
    const dy = d ? d.dy : 0;
    if (st.bbox.y1 + dy < f.y || st.bbox.y0 + dy > f.y + f.h) continue;
    if (d) { ctx.save(); ctx.translate(d.dx * s, d.dy * s); drawWire(ctx, st.wire, s, f.y); ctx.restore(); }
    else drawWire(ctx, st.wire, s, f.y);
  }
}
function redrawRange(y0, y1) {
  frames.forEach((f, i) => { if (y1 >= f.y && y0 <= f.y + f.h) drawInk(i); });
}
function ensurePages() {
  if (pdf || !doc) return;
  const n = notebookPagesNeeded();
  if (n !== pageHeights.length) { pageHeights = Array(n).fill(A4H); layout(); buildPages(); }
}

// ---------- Radieren: ganze Striche, die der Kreis berührt ----------
function segDist(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy;
  const t = l ? Math.max(0, Math.min(1, ((px - a[0]) * dx + (py - a[1]) * dy) / l)) : 0;
  return Math.hypot(px - a[0] - t * dx, py - a[1] - t * dy);
}
function hits(st, x, y, r) {
  const b = st.bbox;
  if (x < b.x0 - r || x > b.x1 + r || y < b.y0 - r || y > b.y1 + r) return false;
  const p = st.wire.p;
  if (p.length === 1) return Math.hypot(x - p[0][0], y - p[0][1]) <= r + p[0][3] / 2;
  for (let i = 1; i < p.length; i++) {
    if (segDist(x, y, p[i - 1], p[i]) <= r + Math.max(p[i - 1][3], p[i][3]) / 2) return true;
  }
  return false;
}
function eraseAt(x, y, erased) {
  const r = ERASER_PX / scale;
  for (const id of [...order]) {
    const st = strokes.get(id);
    if (!st || !hits(st, x, y, r)) continue;
    erased.push({ id, data: st.data });
    removeStroke(id);
    send({ type: "remove", id });
  }
}

// ---------- Lasso: umkreisen, verschieben, kopieren, ausschneiden, löschen ----------

// Seitenkoordinate → Bildschirmkoordinate (über die Seite, auf der der Punkt liegt)
function toClient(x, y) {
  let i = frames.findIndex(f => y <= f.y + f.h);
  if (i < 0) i = frames.length - 1;
  const r = els[i].div.getBoundingClientRect();
  return [r.left + x * scale, r.top + (y - frames[i].y) * scale];
}
function selBox(ids) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id of ids) {
    const b = strokes.get(id)?.bbox;
    if (!b) continue;
    x0 = Math.min(x0, b.x0); y0 = Math.min(y0, b.y0); x1 = Math.max(x1, b.x1); y1 = Math.max(y1, b.y1);
  }
  return { x0, y0, x1, y1 };
}
function select(ids) {
  sel = ids && ids.size ? { ids: new Set(ids), bbox: selBox(ids) } : null;
  placeSel();
}
function placeSel() {
  if (!sel) { selEl.style.display = "none"; return; }
  const b = sel.bbox, dx = drag ? drag.dx : 0, dy = drag ? drag.dy : 0, pad = 6;
  const [l, t] = toClient(b.x0 + dx, b.y0 + dy), [, bt] = toClient(b.x0 + dx, b.y1 + dy);
  selEl.style.display = "block";
  selEl.style.left = l - pad + "px"; selEl.style.top = t - pad + "px";
  selEl.style.width = (b.x1 - b.x0) * scale + 2 * pad + "px"; selEl.style.height = bt - t + 2 * pad + "px";
}
addEventListener("scroll", placeSel, { passive: true });

function insidePolygon(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function finishLasso(poly) {
  lassoPath.setAttribute("d", "");
  if (poly.length < 3) return select(null);
  const ids = new Set();
  for (const id of order) {
    const p = strokes.get(id).wire.p;
    const n = p.filter(q => insidePolygon(q[0], q[1], poly)).length;
    if (n > 0 && n >= p.length / 2) ids.add(id); // mehr als die Hälfte des Strichs im Lasso
  }
  select(ids);
}

// Ersetzt Striche durch neue (verschoben oder eingefügt); ein Schritt fürs Rückgängig
async function replaceStrokes(oldIds, wires) {
  const erased = oldIds.map(id => ({ id, data: strokes.get(id).data }));
  const added = [];
  for (const wire of wires) {
    let id = await strokeID(wire);
    while (strokes.has(id)) id += "#2";
    const data = JSON.stringify(wire);
    const r = addStroke(id, data);
    if (r) redrawRange(r.y0, r.y1);
    send({ type: "add", stroke: { id, data } });
    added.push(id);
  }
  for (const { id } of erased) { removeStroke(id); send({ type: "remove", id }); }
  history.push({ added, erased });
  return added;
}
const shifted = (wire, dx, dy) => ({ ...wire, p: wire.p.map(q => [Math.round((q[0] + dx) * 100) / 100, Math.round((q[1] + dy) * 100) / 100, ...q.slice(2)]) });

function copySel() {
  if (!sel) return;
  clip = [...sel.ids].map(id => strokes.get(id).wire);
  pasteShift = 0;
  document.getElementById("paste").hidden = false;
}
function deleteSel() {
  if (!sel) return;
  const erased = [...sel.ids].map(id => ({ id, data: strokes.get(id).data }));
  select(null);
  for (const { id } of erased) { removeStroke(id); send({ type: "remove", id }); }
  history.push({ added: [], erased });
}
async function paste() {
  if (!clip || !ws || ws.readyState !== 1) return;
  pasteShift += 24;
  const ids = await replaceStrokes([], clip.map(w => shifted(w, pasteShift, pasteShift)));
  lassoing = true; erasing = false; tools();
  select(new Set(ids));
}
document.getElementById("paste").onclick = paste;
document.getElementById("sel-bar").addEventListener("pointerdown", (e) => e.stopPropagation());
document.getElementById("sel-bar").onclick = (e) => {
  const act = e.target.dataset.act;
  if (act === "copy") copySel();
  else if (act === "cut") { copySel(); deleteSel(); }
  else if (act === "delete") deleteSel();
};
// Auswahl ziehen
let dragStart = null, dragFrame = 0;
selEl.addEventListener("pointerdown", (e) => {
  if (!sel || !ws || ws.readyState !== 1) return;
  e.preventDefault(); selEl.setPointerCapture(e.pointerId);
  dragStart = [e.clientX, e.clientY];
  drag = { ids: sel.ids, dx: 0, dy: 0 };
});
selEl.addEventListener("pointermove", (e) => {
  if (!dragStart) return;
  drag.dx = (e.clientX - dragStart[0]) / scale; drag.dy = (e.clientY - dragStart[1]) / scale;
  placeSel();
  cancelAnimationFrame(dragFrame);
  dragFrame = requestAnimationFrame(() => {
    const b = sel.bbox, m = 40 + Math.abs(drag ? drag.dy : 0);
    redrawRange(b.y0 - m, b.y1 + m);
  });
});
const endDrag = async () => {
  if (!dragStart) return;
  dragStart = null;
  const { dx, dy } = drag, ids = [...drag.ids];
  drag = null;
  if (Math.hypot(dx, dy) < 0.5) { placeSel(); redrawRange(sel.bbox.y0 - 40, sel.bbox.y1 + 40); return; }
  const wires = ids.map(id => shifted(strokes.get(id).wire, dx, dy));
  const b = sel.bbox;
  const newIds = await replaceStrokes(ids, wires);
  redrawRange(b.y0 - Math.abs(dy) - 40, b.y1 + Math.abs(dy) + 40);
  select(new Set(newIds));
};
selEl.addEventListener("pointerup", endDrag);
selEl.addEventListener("pointercancel", endDrag);

// ---------- Mitzeichnen ----------
// Mit dem Stift (Pencil) wird die Linie bei mehr Druck etwas breiter, mit der Maus bleibt sie gleich
function penWidth(w, e) {
  if (e.pointerType !== "pen" || !e.pressure) return w;
  return Math.round(w * (0.95 + 0.5 * Math.min(e.pressure, 1)) * 100) / 100;
}
function attachDrawing(el) {
  let cur = null, t0 = 0, rub = null, loop = null;
  const pt = (e) => {
    const r = el.ink.getBoundingClientRect();
    const x = (e.clientX - r.left) / scale, y = (e.clientY - r.top) / scale + frames[el.index].y;
    return [Math.round(x * 100) / 100, Math.round(y * 100) / 100];
  };
  // iPad-Safari: Der Pencil würde sonst wie ein Finger scrollen und den Strich abbrechen.
  // Nur Stift-Berührungen werden hier abgefangen, Finger scrollen weiter (auch die Handfläche).
  const stylus = (e) => [...e.changedTouches].some(t => t.touchType === "stylus");
  for (const type of ["touchstart", "touchmove"]) {
    el.ink.addEventListener(type, (e) => { if (stylus(e)) e.preventDefault(); }, { passive: false });
  }
  el.ink.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch" || !ws || ws.readyState !== 1) return; // Finger scrollt
    e.preventDefault(); el.ink.setPointerCapture(e.pointerId);
    if (lassoing) {
      select(null);
      loop = { poly: [pt(e)], screen: [[e.clientX, e.clientY]] };
      return;
    }
    if (erasing) {
      rub = { erased: [], last: pt(e) };
      eraseAt(...rub.last, rub.erased);
      return;
    }
    document.body.classList.add("drawing");
    t0 = performance.now();
    const w = WIDTHS[width];
    cur = { el, w, pen: e.pointerType === "pen", pts: [[...pt(e), 0, penWidth(w, e), w, 1, 1, 0, 1.571]] };
  });
  el.ink.addEventListener("pointermove", (e) => {
    if (loop) {
      loop.poly.push(pt(e)); loop.screen.push([e.clientX, e.clientY]);
      lassoPath.setAttribute("d", "M" + loop.screen.map(p => p.join(" ")).join(" L") + " Z");
      return;
    }
    if (rub) {
      // Zwischenschritte, damit schnelle Bewegungen keine Striche überspringen
      const [x, y] = pt(e), [lx, ly] = rub.last;
      const step = Math.max(1, ERASER_PX / scale / 2), n = Math.ceil(Math.hypot(x - lx, y - ly) / step);
      for (let i = 1; i <= n; i++) eraseAt(lx + (x - lx) * i / n, ly + (y - ly) * i / n, rub.erased);
      rub.last = [x, y];
      return;
    }
    if (!cur) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const [x, y] = pt(ev), last = cur.pts[cur.pts.length - 1];
      if (Math.hypot(x - last[0], y - last[1]) < 1.5) continue;
      const t = Math.round((performance.now() - t0)) / 1000;
      cur.pts.push([x, y, t, cur.pen ? penWidth(cur.w, ev) : cur.w, cur.w, 1, 1, 0, 1.571]);
    }
    const ctx = el.ink.getContext("2d");
    drawWire(ctx, { c: [...COLORS[color], 1], p: cur.pts.slice(-3) }, el.ink.width / W, frames[el.index].y);
  });
  const end = async () => {
    if (loop) { const poly = loop.poly; loop = null; finishLasso(poly); return; }
    if (rub) {
      if (rub.erased.length) history.push({ added: [], erased: rub.erased });
      rub = null;
      return;
    }
    if (!cur) return;
    const done = cur; cur = null;
    document.body.classList.remove("drawing");
    const wire = { c: [...COLORS[color], 1], ink: "com.apple.ink.pen", p: done.pts };
    const id = await strokeID(wire);
    const data = JSON.stringify(wire);
    const r = addStroke(id, data);
    history.push({ added: [id], erased: [] });
    redrawRange(r.y0, r.y1);
    send({ type: "add", stroke: { id, data } });
  };
  el.ink.addEventListener("pointerup", end);
  el.ink.addEventListener("pointercancel", end);
}

// ---------- Verbindung ----------
function send(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }

function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + base + "/ws");
  ws.onopen = () => status("live");
  ws.onclose = (e) => {
    if (e.code === 4001) return fail("Das Teilen wurde beendet.");
    status("Verbindung unterbrochen …");
    setTimeout(async () => { await load(true); connect(); }, 3000);
  };
  ws.onmessage = (e) => {
    let msg; try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "changes") {
      let y0 = Infinity, y1 = -Infinity;
      for (const c of msg.changes) {
        if (c.data) {
          if (strokes.has(c.id)) continue;
          const r = addStroke(c.id, c.data); if (r) { y0 = Math.min(y0, r.y0); y1 = Math.max(y1, r.y1); }
        } else {
          removeStroke(c.id);
        }
      }
      ensurePages();
      if (y0 <= y1) redrawRange(y0, y1);
    } else if (msg.type === "view" && follow) {
      const target = (msg.y0 * scale) + document.getElementById("pages").offsetTop - document.getElementById("bar").offsetHeight;
      scrollTo({ top: Math.max(0, target), behavior: "smooth" });
    } else if (msg.type === "presence") {
      status(msg.guests > 1 ? `live · ${msg.guests} Gäste` : "live");
    }
  };
}

async function load(reload) {
  const res = await fetch(base + "/data", { cache: "no-store" });
  if (!res.ok) { fail("Dieser Link ist nicht (mehr) gültig."); throw new Error("ungültig"); }
  const data = await res.json();
  if (reload) { strokes.clear(); order = []; }
  doc = data;
  document.getElementById("title").textContent = data.title || "BetterNotes";
  document.title = (data.title || "BetterNotes") + " · live";
  for (const s of data.strokes) addStroke(s.id, s.data);
  if (data.kind === "pdf" && !pdf) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    pdf = await pdfjsLib.getDocument(base + "/pdf").promise;
    pageHeights = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const vp = (await pdf.getPage(i)).getViewport({ scale: 1 });
      pageHeights.push(W * vp.height / vp.width);
    }
  } else if (!pdf) {
    pageHeights = Array(notebookPagesNeeded()).fill(A4H);
  }
  layout(); buildPages();
}

let resizeTimer;
// Safari am iPad meldet „resize“ auch, wenn nur die Leisten einklappen: dann nichts neu anlegen
let lastWidth = 0;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = document.getElementById("pages").clientWidth;
    if (w !== lastWidth) { lastWidth = w; buildPages(); }
  }, 200);
});
load(false).then(connect).catch(() => {});
</script>
